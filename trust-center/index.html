nded secure configuration for agencies.","tier":"gated","md":"# Secure Configuration Guide (agency-facing)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification.\n\n| | |\n|---|---|\n| Audience | Agency administrators of Orrinwick Beacon |\n| Status | Outline. Author to write each section |\n| Rules | `SCG-CSO-RSC`, `SCG-CSO-AUP`, `SCG-CSO-PUB`, `SCG-CSO-SDF`, `SCG-ENH-*` |\n\nRule `SCG-CSO-RSC` requires recommendations for securely configuring the service. Write each section as an instruction an agency administrator can follow.\n\n## 1. Sign-in and single sign-on\n1. Enforce single sign-on with a phishing-resistant factor for all agency users.\n2. TODO (author): where the setting is, the recommended value and the risk of the default.\n\n## 2. Roles and permissions\nTODO (author): the administrator, responder and read-only roles, and which permissions each one holds.\n\n## 3. API and webhook access\n1. Restrict API access to agency egress ranges.\n2. TODO (author): token lifetime, rotation and scopes.\n\n## 4. Notification content\nTODO (author): the reference-only payload mode (alert summaries never travel in push, email, SMS or voice) and how to enable it.\n\n## 5. Audit trail and export\n1. Enable audit export to your SIEM.\n2. TODO (author): retention settings and export format.\n\n## 6. Recommended defaults (`SCG-CSO-SDF`)\nTODO (author): a table of every security setting, its default and the recommended value.\n\n## 7. Access to this guide (`SCG-CSO-AUP`, `SCG-CSO-PUB`)\nTODO (author): how an agency obtains and uses the guide, and whether it is public.\n"},{"id":"security-decision-record","name":"Security Decision Record","note":"Recorded security decisions with verification and validation links.","tier":"gated","md":"# Security Decision Record: Orrinwick Beacon\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification.\n\nClass C replaces the narrative SSP with a persistently maintained record of security decisions (SDR rules, see `rules-matrix.md`). Each entry below is one decision. Add an entry whenever a design, tooling or risk decision is made.\n\n| Field | Value |\n|---|---|\n| Offering | Orrinwick Beacon (fictional multi-tenant alert-routing SaaS) |\n| Target | FedRAMP 20x Class C |\n| Scope | `minimum-assessment-scope.md` |\n| Owner | GRC Lead (fictional) |\n| Last reviewed | 2026-11-21 |\n\n## Decision log\n\n### SD-001: Workforce authentication is passwordless-first\n- **Decision:** WebAuthn / platform authenticators required for all workforce SSO; no password-only path.\n- **Related KSI:** KSI-IAM-APM\n- **Verification:** IdP policy as code (`environment/iac-plan.json`, `idp_policy`)\n- **Validation:** live enrollment check (`apm-live-user-factors`)\n- **Status:** implemented\n\n### SD-002: Infrastructure is declared in code; manual resources are defects\n- **Decision:** All production resources come from Terraform; unmanaged resources are findings.\n- **Related KSI:** KSI-CNA-EIS\n- **Known gap:** none open. A break-glass bastion built by hand during an incident was removed and its resources were brought under IaC review. A scheduled drift scan now checks that nothing exists outside IaC.\n- **Status:** implemented\n\n### SD-003: Recovery uses backup and restore with cross-region encrypted backups\n- **Decision:** Production runs multi-AZ in us-east-1. AWS Backup (a native AWS service) takes recovery points of the database and the backup and export buckets every 2 hours and copies them to a vault in us-west-2 that uses a separate encryption key and a compliance-mode vault lock (resource P12, flow F43). No standing environment exists in the recovery region. Terraform builds one on demand from the copied recovery points. The scope record stays vendor-neutral; AWS Backup is the design choice for the fictional environment.\n- **Objectives:** RTO 8 hours, RPO 4 hours, backup retention at least 14 days, restore test every 90 days (`environment/recovery-objectives.json`). These are fictional numbers that I chose; FedRAMP leaves them to the provider (KSI-RPL-RRO). The objectives are reviewed at least every 90 days (POL-RPL RPL-1).\n- **Options considered:** warm standby (rejected: doubles the assessed environment), pilot light (rejected: still a standing replica database and network to assess), backup and restore (chosen), multi-AZ only (rejected: no protection from a regional failure).\n- **Scope consequences:** Backups hold every category of federal customer data (D10), so P12 is in scope. Using a recovery environment may be a significant change (OQ9). Agency data removal requests must reach backups in both regions (OQ10).\n- **Related KSIs:** KSI-RPL-RRO, KSI-RPL-ABO, KSI-RPL-ARP, KSI-RPL-TRC, KSI-CNA-OFA, KSI-SVC-RUD\n- **Verification:** `abo-iac-backup-policy` (static), `abo-live-backup-currency` (live) and `abo-live-failed-job-alerts` (live). Since 2026-11-20 the first two check the 2-hour backup interval and a compliance-mode vault lock. Since 2026-11-22 the third checks that backup and copy jobs ran in the last day and that each failed job raised an alert within 60 minutes (POL-RPL RPL-2). Restore tests are checked under KSI-RPL-TRC.\n- **Known gaps:** the restore test interval differs between `environment/recovery-objectives.json` (90 days) and POL-RPL RPL-4 (6 months); I will decide it in the RPL design review.\n- **Status:** partial\n\n### SD-004: Scope decisions accepted (OQ1 to OQ10)\n- **Decision:** On 2026-11-19 all ten scope questions in `mas/mas-record.json` were resolved by accepting the stated leaning.\n  - OQ1: telephony uses a content-free design, and the provider is documented as a third party.\n  - OQ2: the mobile app is outside the boundary (supplement item).\n  - OQ3: billing stays out, provided only per-tenant aggregates are exported.\n  - OQ4: error tracking stays out, provided a pipeline test proves no identifiers leave.\n  - OQ5: support ticketing, email and chat stay out, with structured intake, redaction and data loss prevention.\n  - OQ6: routing and identity data are rated Moderate for integrity, to be revisited at the categorization review.\n  - OQ7: agency-supplied content is federal customer data; service-generated records are metadata.\n  - OQ8: each policy and staff role is listed and tied to the policy set.\n  - OQ9: the recovery environment uses the same Terraform modules and controls, and each activation is logged as a significant change event.\n  - OQ10: backup retention is the data removal window in customer agreements.\n- **Related rules:** MAS-CSO-IIR, MAS-CSO-FLO, MAS-CSO-MDI, MAS-CSO-TPR, MAS-CSO-SUP\n- **Verification:** conditions for OQ3, OQ4 and OQ5 are the prohibited flows PF6, PF4 and PF1; automated checks for them are not built yet.\n- **Status:** accepted\n\n### SD-005: TODO add decisions for logging, secrets, supply chain\n\n### SD-006: Incidents are rated with PAIN, and the reporting clock starts at the reportability decision\n- **Decision:** Each incident is marked reportable or not reportable to FedRAMP (IEC-CSO-EFR) and rated with the Potential Agency Impact N-rating, N0 to N5 (IEC-CSO-EFI). A reportable incident with no rating counts as N5 (IEC-CSO-DPR). An after action report is required for every reportable incident and every incident rated N2 or above. The reporting clock starts once the incident is evaluated, found reportable and rated or defaulted to N5, not at initial detection. The plan is reviewed each year, and when an after action report or a quarterly incident review finds that it needs to change.\n- **Options considered:** an internal low, moderate, high and critical scale (rejected: it needs a mapping to FedRAMP's scale and splits incident and vulnerability response); a plan review after every incident (rejected: it repeats the after action report); starting the reporting clock at detection (rejected: the rules tie the initial report to identifying a reportable incident, and the default N5 rating stops the rating step from delaying it).\n- **Why:** FedRAMP defines \"persistently\" (FRD-PER) as a documented, repeated cycle whose status is always known. POL-INR documents the cycle for the INR KSIs, and the checks test that cycle. Using PAIN for incidents and vulnerabilities gives one scale, so a likely exploitable vulnerability above N3 that is internet-reachable can become a reportable incident (VER-TFR-IRI) without a conversion.\n- **Related KSIs:** KSI-INR-RIR, KSI-INR-RPI, KSI-INR-AAR\n- **Related rules:** IEC-CSO-EFR, IEC-CSO-EFI, IEC-CSO-DPR, IEC-CSO-IIR, VER-TFR-IRI\n- **Verification:** `inr-rir-static`, `inr-rir-live`. Design and break tests in `docs/validator-design/INR.md`. Plan: `docs/incident-response-plan.md`\n- **Status:** implemented for INR-RIR; INR-RPI and INR-AAR checks in progress\n"},{"id":"significant-change-log","name":"Significant Change Log","note":"Significant changes and their notices.","tier":"gated","md":"# Significant change log\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification.\n> Generated by `tools/build_change_log.py` from [`mas/scope-changes.json`](../mas/scope-changes.json), the machine-readable version of this log. Do not edit.\n\nRules: `SCN-*` in [`rules-matrix.md`](rules-matrix.md). Policy: POL-CMT CMT-5 and CMT-6, POL-CNA CNA-7b.\n\n## Changes to the scope record\n\nEvery change to `mas/mas-record.json` has an entry. CI fails when the scope record changes without one.\n\n| ID | Date | Change | Resources | Change type | Notice | Notice sent | Protection review |\n|---|---|---|---|---|---|---|---|\n| SC-001 | 2026-11-19 | Baseline. Recovery model set to backup and restore with cross-region copies. Added the cross-region backup vault (P12) and the on-demand recovery environment (P13) with restore flow F44. | P12, P13 | Not significant | Not required | Not needed | 2026-11-22 |\n| SC-002 | 2026-11-21 | Support-derived data (D8) recorded on managed administrative endpoints (E8), with flow F45 from support ticketing (S1). This records an existing path: support staff already read tickets on company laptops. | E8, S1 | Not significant | Not required | Not needed | 2026-11-22 |\n\n### Evaluations\n\n- **SC-001:** Recorded as the baseline before first certification. No agency is relying on the offering yet, so no notification is due.\n- **SC-002:** No resource was added or removed and no boundary decision changed. E8 was already in scope and already protected by device management, endpoint detection and disk encryption. Not likely to substantively affect the security posture, so not a significant change and no notification is due. A protection review is due within 20 business days under POL-CNA CNA-7b.\n\n## Pipeline changes in the last 30 days\n\nEvery change made through the pipeline gets one of the four change types before release (POL-CMT CMT-6). Routine recurring and not significant changes are counted here, not listed. An adaptive or transformative change is also entered in the table above.\n\n| Change type | Changes |\n|---|---|\n| Routine recurring | 190 |\n| Not significant | 22 |\n| Adaptive | 0 |\n| Transformative | 0 |\n"},{"id":"vdr-report","name":"VDR Report","note":"Vulnerability detection and response findings.","tier":"gated","md":"# Vulnerability Detection and Response report\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification.\n\nRules: VDR-* in `rules-matrix.md`. Findings below are the seeded demo findings that the validators surface in `evidence/latest.json`.\n\n| ID | Finding | Scope resource | Source KSI | Severity (demo) | Detected | Target | Status |\n|---|---|---|---|---|---|---|---|\n| BCN-V-001 | Internet-open SSH (inbound and outbound) on `legacy-bastion`, created by hand during an incident. It bypasses the E6 access gateway and is not in infrastructure code | P1, E6 | KSI-CNA-RNT | High | seeded | TODO | Open |\n| BCN-V-002 | Unencrypted volume `vol-legacy-1` attached to the bastion | P1 | KSI-SVC-SIN | Moderate | seeded | TODO | Open |\n| BCN-V-003 | `notify_provider_keys` (credentials for T1 to T3) last rotated 143 days ago (limit 90) | P6 | KSI-SVC-ASM | Moderate | seeded | TODO | Open |\n| BCN-V-004 | 3 unused IAM permission findings | E6 | KSI-IAM-ELP | Low | seeded | TODO | Open |\n| BCN-V-005 | Resources outside intended IaC state (`legacy-bastion` security group, instance and volume) | P1 | KSI-CNA-EIS | Moderate | seeded | TODO | Open |\n| BCN-V-006 | Newest database backup is 6 hours old against a 4 hour recovery point objective | P3 | KSI-RPL-ABO | Moderate | seeded | TODO | Open |\n\nTODO: replace the placeholder severities with the VDR classification and timeframes from the official rules, and wire this table to a real scanner feed.\n"},{"id":"POL-CED","name":"POL-CED Cybersecurity education policy","note":"Security policy","tier":"gated","md":"# Cybersecurity education policy (POL-CED)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | GRC Lead |\n| Approver | CISO |\n| Version | 0.1 draft, effective 2026-11-19 |\n| Review cadence | Annual |\n| Theme | CED: Cybersecurity Education |\n\n## Purpose\n\nStaff know the security duties of their role and the company checks that the training works.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| N1 | Engineering staff with production access |\n| N2 | Customer support staff with tenant access |\n| N3 | Security and compliance team |\n| N5 | Personnel security process |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| CED-1 | All staff complete general security training within 30 days of hire and once every 12 months. | KSI-CED-RAT |\n| CED-2 | Staff with production access, support staff with tenant access and incident responders complete role-specific training before access is granted. | KSI-CED-RAT |\n| CED-3 | Engineering staff complete secure software delivery training each year. | KSI-CED-RAT |\n| CED-4 | Staff on the incident and recovery roster take part in at least one recovery exercise each year. | KSI-CED-RAT |\n| CED-5 | The GRC Lead reviews training completion and effectiveness each quarter. Effectiveness evidence includes phishing exercise results and incident root causes. | KSI-CED-RAT |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-CED-RAT | Reviewing All Training | none yet | not_implemented |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-CMT","name":"POL-CMT Change management policy","note":"Security policy","tier":"gated","md":"# Change management policy (POL-CMT)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | Platform Lead |\n| Approver | CISO |\n| Version | 1.0, approved by the CISO on 2026-11-22 |\n| Review cadence | Annual |\n| Theme | CMT: Change Management |\n\n## Purpose\n\nEvery change to the offering is recorded, reviewed, tested and reversible.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| E1 | Source control (hosted) |\n| E2 | CI/CD pipeline |\n| E3 | Infrastructure as code state and runners |\n| P1 | Production cloud accounts and network |\n| P2 | Application compute (API, routing engine, notification workers, web console) |\n| P11 | Container registry and artifact store |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| CMT-1 | Every change to a production resource is made through the pipeline. The pipeline logs the change, the author, the reviewer and the result. | KSI-CMT-LMC |\n| CMT-2 | Production machine-based resources are replaced from a trusted image or build. Staff do not modify running resources by hand. | KSI-CMT-RMV |\n| CMT-3 | The Platform Lead reviews the change procedure each year, and within 10 business days after any failed or emergency change. Each review is recorded as a new entry in environment/grc-records.json. | KSI-CMT-RVP |\n| CMT-4 | Every deployment runs automated tests for integrity and security before release and checks that the deployed state matches the intended state after release. | KSI-CMT-VTD |\n| CMT-5 | A change that matches a significant change rule is entered in the significant change log. The GRC Lead sends the required notice within the rule timeline (SCN rules). | KSI-CMT-LMC, KSI-CMT-RVP |\n| CMT-6 | Every change made through the pipeline is assessed for its change type before release: routine recurring, adaptive, transformative or not significant. Every change gets one of these four types, so no change skips the assessment. Routine recurring and not significant changes need no notice. The type is recorded with the change in the pipeline log (CMT-1), and a change that alters the scope record is also logged in mas/scope-changes.json. | KSI-CMT-LMC |\n| CMT-7 | A change of certification class is not a significant change. It needs a new certification before the offering operates at the new class (FRC-CCL-UCC, FRC-CCL-DCC). | none (certification rule) |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-CMT-LMC | Logging Changes | `lmc-iac-change-logging`, `lmc-live-change-coverage`, `lmc-live-change-types` | pass |\n| KSI-CMT-RMV | Redeploying vs Modifying | `rmv-iac-redeploy-policy`, `rmv-live-image-match` | pass |\n| KSI-CMT-RVP | Reviewing Change Procedures | `cmt-rvp-static`, `cmt-rvp-live`, `cmt-rvp-change` | pass |\n| KSI-CMT-VTD | Validating Throughout Deployment | `vtd-iac-pipeline-stages`, `vtd-live-pipeline-runs` | pass |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-CNA","name":"POL-CNA Cloud-native architecture policy","note":"Security policy","tier":"gated","md":"# Cloud-native architecture policy (POL-CNA)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | Platform Lead |\n| Approver | CISO |\n| Version | 1.0, approved by the CISO on 2026-11-21 |\n| Review cadence | Annual |\n| Theme | CNA: Cloud Native Architecture |\n\n## Purpose\n\nThe architecture limits who and what can reach each resource and keeps the service available during component loss.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| P1 | Production cloud accounts and network |\n| P2 | Application compute (API, routing engine, notification workers, web console) |\n| P3 | Managed relational database |\n| P4 | Object storage |\n| P8 | Load balancer, API gateway and web application firewall |\n| P12 | Cross-region backup replica storage (us-west-2) |\n| E3 | Infrastructure as code state and runners |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| CNA-1 | Each resource has a documented function in the scope record and its own role declared in code. A role grants only the named actions its function needs: no wildcard actions, no role shared between services, and permissions unused for 90 days are removed (POL-IAM IAM-3). Network access follows CNA-6, and data access follows SVC-6. | KSI-CNA-DFP |\n| CNA-2 | Infrastructure is declared in code. A resource that exists outside the code is a defect and is removed or brought into the code within 5 business days. AWS Config rules correct drift automatically within 15 minutes. | KSI-CNA-EIS |\n| CNA-3 | Each third-party machine-based resource is compared with its provider's best-practice guidance on every validation run, and at least every 3 days: the CIS AWS Foundations Benchmark for the AWS account, and the vendor's security baseline for each SaaS tool (E1, E7, E9). Failed controls are fixed or accepted as exceptions under the policy exception process. | KSI-CNA-IBP |\n| CNA-4 | Public exposure is limited to the load balancer, gateway and web application firewall (P8). Each open port and public endpoint is justified in the scope record. | KSI-CNA-MAT |\n| CNA-5 | Production runs in more than one availability zone. Cross-region encrypted backups meet the recovery objectives in policy POL-RPL. | KSI-CNA-OFA |\n| CNA-6 | Inbound and outbound traffic is denied by default. Allowed flows match the flows in the scope record. The allowed rules for each security group and the allowed principals for each bucket policy are kept in environment/network-privileges.json, owned by the Platform Lead. | KSI-CNA-RNT |\n| CNA-7a | The Platform Lead reviews protections at least once a year. | KSI-CNA-RVP |\n| CNA-7b | The Platform Lead also reviews protections after each change recorded in mas/scope-changes.json. The deadline depends on the change type in the SCN rules. Transformative: before the change starts, and again within 5 business days after it is finished. Adaptive: within 10 business days after the change is finished, before the notice under SCN-ADP-NTF. Not significant: within 20 business days after the change is finished. Routine recurring: no separate review, because the annual review covers these changes. | KSI-CNA-RVP |\n| CNA-8 | Production uses logical networks and security groups to separate tenants' workloads from operations tooling and from other trust zones. The Platform Lead reviews security group, WAF and NAT egress rules every 90 days and records the review in environment/live-state.json#traffic_flow_reviews. | KSI-CNA-ULN |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-CNA-DFP | Defining Functionality and Privileges | `dfp-iac-role-definitions`, `dfp-live-role-privileges`, `dfp-live-network-data-privileges` | pass |\n| KSI-CNA-EIS | Enforcing Intended State | `eis-iac-drift-rule`, `eis-live-drift`, `eis-live-auto-remediation` | pass |\n| KSI-CNA-IBP | Implementing Best Practices | `ibp-iac-provider-guidance`, `ibp-live-benchmark-results`, `ibp-live-saas-guidance` | pass |\n| KSI-CNA-MAT | Minimizing Attack Surface | `mat-iac-exposure`, `mat-live-exposed-endpoints` | pass |\n| KSI-CNA-OFA | Optimizing for Availability | `ofa-iac-redundancy`, `ofa-live-availability`, `ofa-live-recovery-time` | pass |\n| KSI-CNA-RNT | Restricting Network Traffic | `rnt-iac-traffic`, `rnt-live-traffic` | pass |\n| KSI-CNA-RVP | Reviewing Protections | `cna-rvp-static`, `cna-rvp-live`, `cna-rvp-change` | pass |\n| KSI-CNA-ULN | Using Logical Networking | `uln-iac-logical-network`, `uln-live-network-controls`, `uln-live-flow-review` | pass |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-IAM","name":"POL-IAM Identity and access management policy","note":"Security policy","tier":"gated","md":"# Identity and access management policy (POL-IAM)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | CISO |\n| Approver | CISO |\n| Version | 0.1 draft, effective 2026-11-19 |\n| Review cadence | Annual |\n| Theme | IAM: Identity and Access Management |\n\n## Purpose\n\nOnly authorised people and workloads reach resources, with the least privilege needed and for the shortest time.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| E6 | Privileged access management and production access gateway |\n| E7 | Workforce identity provider (SSO and MFA) |\n| E8 | Managed administrative endpoints |\n| E9 | Endpoint detection and response and device management |\n| S4 | Support impersonation tooling |\n| N1 | Engineering staff with production access |\n| N2 | Customer support staff with tenant access |\n| P1 | Production cloud accounts and network |\n| P5 | Key management service |\n| P6 | Secrets management service |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| IAM-1 | Account creation, change and removal are automated from the identity provider. Leavers lose access within 24 hours. Roles and groups are created, changed and removed only by the Terraform pipeline or the identity provider's provisioning. | KSI-IAM-AAM |\n| IAM-2 | Workforce sign-in uses phishing-resistant passwordless methods (WebAuthn or platform authenticators). No password-only path exists. | KSI-IAM-APM |\n| IAM-3 | Access follows least privilege. Permissions unused for 90 days are removed. Access is reviewed every quarter. | KSI-IAM-ELP |\n| IAM-4 | Production and tenant-data access is granted just in time through the access gateway (E6), with an approval, a reason and an expiry. Non-user accounts hold no standing admin access, and their sessions last 60 minutes or less. The Security Operations Lead reviews non-user access every 90 days. | KSI-IAM-JIT |\n| IAM-5 | Workloads authenticate with short-lived credentials. Static keys rotate at least every 90 days and are held in secrets management (P6). | KSI-IAM-SNU |\n| IAM-6 | Suspicious account activity raises an alert. The on-call responder starts a response within the time set in the incident response plan. | KSI-IAM-SUS |\n| IAM-7 | Support impersonation (S4) needs a recorded customer approval and writes an audit entry that the customer can see. | KSI-IAM-ELP, KSI-IAM-JIT |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-IAM-AAM | Automating Account Management | `aam-iac-lifecycle-automation`, `aam-live-deprovisioning`, `aam-live-role-group-lifecycle` | pass |\n| KSI-IAM-APM | Adopting Passwordless Methods | `apm-iac-idp-policy`, `apm-live-user-factors` | pass |\n| KSI-IAM-ELP | Ensuring Least Privilege | `elp-iac-wildcards`, `elp-live-unused-perms` | pass |\n| KSI-IAM-JIT | Authorizing Just-in-Time | `jit-iac-access-model`, `jit-live-standing-access`, `jit-live-non-user-accounts` | pass |\n| KSI-IAM-SNU | Securing Non-User Authentication | `snu-iac-workload-auth`, `snu-live-access-key-age` | fail |\n| KSI-IAM-SUS | Responding to Suspicious Activity | `sus-iac-response-rules`, `sus-live-response-time` | pass |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-INR","name":"POL-INR Incident response policy","note":"Security policy","tier":"gated","md":"# Incident response policy (POL-INR)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | CISO |\n| Approver | CISO |\n| Version | 1.1, approved by the CISO on 2026-11-21 |\n| Review cadence | Annual |\n| Theme | INR: Incident Response |\n\n## Purpose\n\nStaff detect, classify, report and learn from security incidents in the time the rules require.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| N3 | Security and compliance team |\n| N7 | Incident and on-call operations for the offering |\n| E4 | Production logging, monitoring and alerting stack |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| INR-1 | The incident response plan defines roles, evaluation steps and the communication timelines for the IEC rules. Each incident is rated with the Potential Agency Impact N-rating (PAIN, N0 to N5) and marked as reportable or not reportable to FedRAMP. | KSI-INR-RIR |\n| INR-2 | Each FedRAMP Reportable Incident, and each incident rated N2 or above, ends with an after action report within 10 business days. A reportable incident with no rating is treated as N5 (IEC-CSO-DPR). | KSI-INR-AAR |\n| INR-3 | The CISO reviews the plan each year, and when an after action report or a quarterly incident review finds that the plan needs to change. | KSI-INR-RIR, KSI-INR-RPI |\n| INR-4 | The security team reviews all past incidents and near misses, of any rating, every quarter for repeated causes. The review lists the incidents it covered and records its findings. | KSI-INR-RPI |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-INR-AAR | Generating After Action Reports | none yet | not_implemented |\n| KSI-INR-RIR | Reviewing Incident Response Procedures | `inr-rir-static`, `inr-rir-live` | pass |\n| KSI-INR-RPI | Reviewing Past Incidents | none yet | not_implemented |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-MLA","name":"POL-MLA Monitoring, logging and auditing policy","note":"Security policy","tier":"gated","md":"# Monitoring, logging and auditing policy (POL-MLA)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | Security Operations Lead |\n| Approver | CISO |\n| Version | 0.1 draft, effective 2026-11-19 |\n| Review cadence | Annual |\n| Theme | MLA: Monitoring, Logging, and Auditing |\n\n## Purpose\n\nSecurity-relevant events are recorded, protected, searched and reviewed.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| E4 | Production logging, monitoring and alerting stack |\n| P1 | Production cloud accounts and network |\n| P2 | Application compute (API, routing engine, notification workers, web console) |\n| P3 | Managed relational database |\n| P4 | Object storage |\n| P8 | Load balancer, API gateway and web application firewall |\n| E6 | Privileged access management and production access gateway |\n| E7 | Workforce identity provider (SSO and MFA) |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| MLA-1 | Log access is limited to named security and operations roles. Log changes and deletions raise an alert. Log data has three sensitivity classes: C1 security audit, C2 operational and C3 logs that may hold federal contact data. Each role's access is limited to the classes in environment/log-classes.json, and access to C3 is just in time. | KSI-MLA-ALA |\n| MLA-2 | Resource configurations are evaluated against the baseline at least daily. The configuration of each SaaS tool (E1, E7, E9) is exported and evaluated against its baseline at least daily (environment/saas-config.json). | KSI-MLA-EVC |\n| MLA-3 | Each in-scope resource logs authentication, authorisation, administrative, configuration and data-access events. Logs do not contain alert summaries or credentials. The Security Operations Lead keeps the list of logged resources and event types in environment/logging-list.json and reviews it every year. | KSI-MLA-LET |\n| MLA-4 | Logs flow to the security monitoring stack (E4), which correlates events and raises alerts. The Security Operations Lead reviews the monitoring stack every 30 days, checks that each expected log source reports, and records the review in environment/live-state.json#siem_reviews. | KSI-MLA-OSM |\n| MLA-5 | Security staff review alerts daily and review log coverage each quarter. Logs are kept for 12 months. | KSI-MLA-RVL |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-MLA-ALA | Authorizing Log Access | `ala-iac-log-access-model`, `ala-live-log-access-grants`, `ala-live-sensitivity-classes` | pass |\n| KSI-MLA-EVC | Evaluating Configurations | `evc-iac-config-testing`, `evc-live-scan-results`, `evc-live-saas-configuration` | pass |\n| KSI-MLA-LET | Logging Event Types | `let-iac-cloudtrail`, `let-live-cloudtrail`, `let-list-coverage` | pass |\n| KSI-MLA-OSM | Operating SIEM Capability | `osm-iac-siem-config`, `osm-live-siem-health`, `osm-live-siem-review` | pass |\n| KSI-MLA-RVL | Reviewing Logs | `rvl-iac-review-process`, `rvl-live-review-activity` | pass |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-PIY","name":"POL-PIY Policy and inventory policy","note":"Security policy","tier":"gated","md":"# Policy and inventory policy (POL-PIY)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | GRC Lead |\n| Approver | CISO |\n| Version | 0.1 draft, effective 2026-11-19 |\n| Review cadence | Annual |\n| Theme | PIY: Policy and Inventory |\n\n## Purpose\n\nThe company knows what it runs, keeps its policies current and has executive backing for security.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| N3 | Security and compliance team |\n| N4 | Security policies and procedures |\n| E1 | Source control (hosted) |\n| E5 | Vulnerability scanning and dependency analysis |\n| P1 | Production cloud accounts and network |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| PIY-1 | The inventory of in-scope resources is generated from the scope record and checked against live state. A live resource with no scope ID is a finding. Each user in the identity provider's workforce export maps to a people resource in the scope record, and the third-party register matches the scope record's third-party resources. | KSI-PIY-GIV |\n| PIY-2 | The executive team reviews security status, risks and policy exceptions every quarter. The review is minuted. | KSI-PIY-RES |\n| PIY-3 | The executive team reviews security spending against the risk register each year. | KSI-PIY-RIS |\n| PIY-4 | Each release passes a threat model, static analysis and a dependency scan, and applies Orrinwick's secure-by-design principles: secure defaults, memory-safe languages where possible, MFA by default and no default passwords. The Security Operations Lead reviews the secure development lifecycle and these principles every 90 days. The principles and review settings are kept in the sdlc_review record in environment/iac-plan.json, and review results in environment/live-state.json#sdlc. | KSI-PIY-RSD |\n| PIY-5 | Orrinwick publishes a vulnerability disclosure route, answers reports within 3 business days and tracks each report to closure. | KSI-PIY-RVD |\n| PIY-6 | The GRC Lead reviews every policy in this set at its stated cadence and records the review date. | KSI-PIY-RES |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-PIY-GIV | Generating Inventories | `giv-iac-inventory-generator`, `giv-live-unscoped-resources`, `giv-live-people-third-parties` | pass |\n| KSI-PIY-RES | Reviewing Executive Support | none yet | not_implemented |\n| KSI-PIY-RIS | Reviewing Investments in Security | none yet | not_implemented |\n| KSI-PIY-RSD | Reviewing Security in the SDLC | `rsd-iac-sdlc-policy`, `rsd-live-sdlc-metrics` | pass |\n| KSI-PIY-RVD | Reviewing Vulnerability Disclosures | none yet | not_implemented |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-RPL","name":"POL-RPL Recovery planning policy","note":"Security policy","tier":"gated","md":"# Recovery planning policy (POL-RPL)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | Platform Lead |\n| Approver | CISO |\n| Version | 1.2, approved by the CISO on 2026-11-22 |\n| Review cadence | Annual |\n| Theme | RPL: Recovery Planning |\n\n## Purpose\n\nOrrinwick can restore the offering and its data within its stated objectives.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| P3 | Managed relational database |\n| P4 | Object storage |\n| P12 | Cross-region backup replica storage (us-west-2) |\n| E3 | Infrastructure as code state and runners |\n| P1 | Production cloud accounts and network |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| RPL-1 | The recovery objectives are a recovery time of 8 hours and a recovery point of 4 hours. The Platform Lead reviews them at least every 90 days and records the result in environment/recovery-objectives.json. | KSI-RPL-RRO |\n| RPL-2 | Backups run at least every 2 hours, are encrypted and are copied to a second US region (P12) into a vault that has a compliance-mode lock. Backup jobs and copy jobs are monitored every day. A failed job raises an alert within 60 minutes, and a named person acknowledges it. | KSI-RPL-ABO |\n| RPL-3 | The recovery plan describes how a recovery environment is built from infrastructure code and how data is restored into it. It is kept in step with the architecture. | KSI-RPL-ARP |\n| RPL-4 | A restore test runs at least every 6 months. It records the time taken, the data age restored and any failure. | KSI-RPL-TRC |\n| RPL-5 | The recovery environment, once built, falls under the same scope record and controls as production. | KSI-RPL-ARP |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-RPL-ABO | Aligning Backups with Objectives | `abo-iac-backup-policy`, `abo-live-backup-currency`, `abo-live-failed-job-alerts` | pass |\n| KSI-RPL-ARP | Aligning Recovery Plan | `arp-iac-plan-alignment`, `arp-live-plan-review` | pass |\n| KSI-RPL-RRO | Reviewing Recovery Objectives | `rpl-rro-static`, `rpl-rro-live` | pass |\n| KSI-RPL-TRC | Testing Recovery Capabilities | `trc-iac-restore-test-plan`, `trc-live-restore-results`, `trc-live-test-history` | pass |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-SCR","name":"POL-SCR Supply chain risk policy","note":"Security policy","tier":"gated","md":"# Supply chain risk policy (POL-SCR)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | GRC Lead |\n| Approver | CISO |\n| Version | 0.1 draft, effective 2026-11-19 |\n| Review cadence | Annual |\n| Theme | SCR: Supply Chain Risk |\n\n## Purpose\n\nOrrinwick knows which third parties touch federal customer data and manages the risk they carry.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| T1 | Mobile push notification service |\n| T2 | Transactional email delivery service |\n| T3 | Telephony provider (SMS and voice) |\n| T4 | Application performance and error tracking service |\n| T5 | Cloud infrastructure provider |\n| N6 | Third-party risk management process |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| SCR-1 | Each third party in the data path is listed in the scope record as a third-party resource with its function, the data it receives and its authorisation status. | KSI-SCR-MIT |\n| SCR-2 | A third party is reviewed before first use and each year after. Notification providers (T1 to T3) receive no alert summaries. | KSI-SCR-MIT |\n| SCR-3 | The GRC Lead monitors third-party advisories, outages and ownership changes every month and records any that affect the offering. | KSI-SCR-MON |\n| SCR-4 | Open-source and third-party software components are tracked in a software bill of materials for each release. | KSI-SCR-MIT, KSI-SCR-MON |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-SCR-MIT | Mitigating Supply Chain Risk | `mit-iac-supply-chain-policy`, `mit-live-supply-chain-risks` | pass |\n| KSI-SCR-MON | Monitoring Supply Chain Risk | `mon-iac-upstream-monitoring`, `mon-live-upstream-advisories` | pass |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"},{"id":"POL-SVC","name":"POL-SVC Service configuration policy","note":"Security policy","tier":"gated","md":"# Service configuration policy (POL-SVC)\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification. Generated by `tools/build_policies.py` from `policies/policy-set.json`; do not edit.\n\n| | |\n|---|---|\n| Owner | Platform Lead |\n| Approver | CISO |\n| Version | 0.1 draft, effective 2026-11-19 |\n| Review cadence | Annual |\n| Theme | SVC: Service Configuration |\n\n## Purpose\n\nConfiguration, secrets, communications and data in the offering are managed by automation and checked against the intended state.\n\n## Scope\n\nAll Orrinwick staff and contractors, and every information resource marked in scope in mas/mas-record.json.\n\nThis policy covers these information resources from the scope record:\n\n| ID | Resource |\n|---|---|\n| P1 | Production cloud accounts and network |\n| P2 | Application compute (API, routing engine, notification workers, web console) |\n| P3 | Managed relational database |\n| P4 | Object storage |\n| P5 | Key management service |\n| P6 | Secrets management service |\n| P7 | Message queue and job scheduler |\n| P8 | Load balancer, API gateway and web application firewall |\n| P9 | DNS and certificate management |\n| E2 | CI/CD pipeline |\n| E3 | Infrastructure as code state and runners |\n\n## Requirements\n\n| ID | Requirement | KSIs |\n|---|---|---|\n| SVC-1 | Resource configuration is applied by automation. Manual configuration is a defect. | KSI-SVC-ACM |\n| SVC-2 | Secrets live in secrets management (P6). Keys are held in the key management service (P5). Secrets rotate at least every 90 days and never appear in code, logs or tickets. Customer-managed keys rotate automatically. Certificates renew automatically, and no certificate is allowed to come within 30 days of expiry. | KSI-SVC-ASM |\n| SVC-3 | The security team evaluates new tools and findings every quarter and records the improvements made. | KSI-SVC-EIS |\n| SVC-4 | The offering does not keep residual access, credentials or data after a change. Deprecated resources are removed within 30 days. The Platform Lead reviews the affected plans and procedures within 20 business days of each scope change and records the review in environment/grc-records.json#change_plan_reviews. | KSI-SVC-PRR |\n| SVC-5 | Customer data is deleted from production within 30 days of a verified customer request and from backups at the next backup expiry. Staging holds synthetic data only. Customer data is deleted 30 days after the contract ends, with no request needed. | KSI-SVC-RUD |\n| SVC-6 | Data at rest is encrypted. Queues, tables and volumes use customer-data keys from the key management service. Stores that hold federal data use versioning and object lock, and the database has deletion protection. | KSI-SVC-SIN |\n| SVC-7 | Every data flow in the scope record uses TLS 1.2 or later with a valid certificate. Certificates renew automatically. Internal flows authenticate the client: mutual TLS between services, and IAM-signed requests (workload or service-linked identity) to AWS services. | KSI-SVC-VCM |\n| SVC-8 | Deployed images and packages are signed. The pipeline verifies the signature and a digest before release. | KSI-SVC-VRI |\n\n## Indicators and validation\n\n| KSI | Name | Automated methods | Current status |\n|---|---|---|---|\n| KSI-SVC-ACM | Automating Configuration Management | `acm-iac-config-automation`, `acm-live-drift` | pass |\n| KSI-SVC-ASM | Automating Secret Management | `asm-iac-rotation`, `asm-live-rotation-age`, `asm-live-keys-certificates` | pass |\n| KSI-SVC-EIS | Evaluating and Improving Security | `sei-iac-improvement-process`, `sei-live-improvement-flow` | fail |\n| KSI-SVC-PRR | Preventing Residual Risk | `prr-iac-cleanup-step`, `prr-live-residual-elements`, `prr-grc-plan-review` | pass |\n| KSI-SVC-RUD | Removing Unwanted Data | `rud-iac-removal-process`, `rud-live-removal-requests`, `rud-terms-agreement` | pass |\n| KSI-SVC-SIN | Securing Information | `sin-iac-encryption`, `sin-live-encryption`, `sin-live-modification-protection` | pass |\n| KSI-SVC-VCM | Validating Communications | `vcm-iac-tls-policy`, `vcm-live-tls-scan`, `vcm-live-client-authentication` | pass |\n| KSI-SVC-VRI | Validating Resource Integrity | `vri-iac-signing`, `vri-live-image-integrity`, `vri-live-artifact-signatures` | pass |\n\nStatus is a simulated validator result. Class C needs at least two automated methods per KSI (`FRC-CSX-VVK`).\n\n## Exceptions\n\nAn exception needs a written request, a named risk owner, a compensating control and an expiry date of no more than 90 days. The GRC Lead records approved exceptions in docs/security-decision-record.md. An expired exception is a policy violation.\n\n## Enforcement\n\nViolations are reported to the GRC Lead. Staff violations follow the personnel security process (N5).\n"}],"policies":[{"id":"POL-CED","title":"Cybersecurity education policy","owner":"GRC Lead","cadence":"Annual"},{"id":"POL-CMT","title":"Change management policy","owner":"Platform Lead","cadence":"Annual"},{"id":"POL-CNA","title":"Cloud-native architecture policy","owner":"Platform Lead","cadence":"Annual"},{"id":"POL-IAM","title":"Identity and access management policy","owner":"CISO","cadence":"Annual"},{"id":"POL-INR","title":"Incident response policy","owner":"CISO","cadence":"Annual"},{"id":"POL-MLA","title":"Monitoring, logging and auditing policy","owner":"Security Operations Lead","cadence":"Annual"},{"id":"POL-PIY","title":"Policy and inventory policy","owner":"GRC Lead","cadence":"Annual"},{"id":"POL-RPL","title":"Recovery planning policy","owner":"Platform Lead","cadence":"Annual"},{"id":"POL-SCR","title":"Supply chain risk policy","owner":"GRC Lead","cadence":"Annual"},{"id":"POL-SVC","title":"Service configuration policy","owner":"Platform Lead","cadence":"Annual"}],"scope":{"in_scope":27,"third_party":7,"out_conditional":8,"out_of_scope":4,"supplement":1}}</script>

    var demoAuth = me.mode === "local" ? '<p class="muted" style="font-size:13px">Demo mode: admin sign-in is a browser setting and not real access control.</p>' : "";
    return '<div class="hero"><h1>Access administration</h1><p>Review requests, approve or revoke access and read the access log.</p>' + (adminMsg ? '<div class="msg ok">' + esc(adminMsg) + "</div>" : "") + demoAuth + "</div>" +
      '<div class="card"><h2>Requests</h2><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Requester</th><th>Organisation</th><th>Purpose</th><th>Status</th><th></th></tr></thead><tbody>' + (rows || '<tr><td colspan="5" class="muted">No requests yet. Submit one from the Access tab to see the flow.</td></tr>') + "</tbody></table></div></div>" +
      '<div class="card"><h2>Access log</h2><p class="lede">The 50 most recent events.</p><div class="tablewrap"><table><thead><tr><th>Time</th><th>Who</th><th>Event</th><th>Detail</th></tr></thead><tbody>' + (log || '<tr><td colspan="4" class="muted">No events yet.</td></tr>') + "</tbody></table></div></div>" + adminExtra();
  }

  function adminExtra() {
    var grants = {}; (adminCache.grants || []).forEach(function (g) { grants[g.id] = g; });
    var last = {}, cnt = {}; (adminCache.log || []).forEach(function (e) { cnt[e.uid] = (cnt[e.uid] || 0) + 1; if (!last[e.uid] || e.ts > last[e.uid]) last[e.uid] = e.ts; });
    var inv = (adminCache.reqs || []).map(function (r) { var g = grants[r.id] || {}; return "<tr><td>" + esc(r.name || r.id) + "</td><td>" + esc(r.org || "") + "</td><td>" + esc(r.role || "") + '</td><td class="mono">' + esc(fmtDate(r.submitted || "")) + "</td><td>" + esc(g.status || "pending") + '</td><td class="mono">' + esc(fmtDate(g.decidedAt || "")) + '</td><td>' + (cnt[r.id] || 0) + '</td><td class="mono">' + esc(fmtDate(last[r.id] || "")) + "</td></tr>"; }).join("");
    var due = (adminCache.reqs || []).filter(function (r) { return (grants[r.id] || {}).status === "denied"; }).map(function (r) { var g = grants[r.id]; return "<tr><td>" + esc(r.name || r.id) + "</td><td>" + esc(r.org || "") + '</td><td class="mono">' + esc(fmtDate(g.decidedAt)) + '</td><td class="mono">' + esc(fmtDate(g.fedrampNoticeDue || "")) + "</td></tr>"; }).join("");
    var sm = adminCache.sum || {}, sumRows = Object.keys(sm).sort().reverse().map(function (mk) { var m = sm[mk]; return "<tr><td class=\"mono\">" + esc(mk) + "</td><td>" + m.events + "</td><td>" + Object.keys(m.users).length + "</td><td>" + esc(Object.keys(m.by).map(function (k) { return k + " " + m.by[k]; }).join(", ")) + "</td></tr>"; }).join("");
    return '<div class="card"><h2>Access inventory and history</h2><p class="lede">Every party that asked for access, with the decision and the activity on record (rule CDS-TRC-AAI). FedRAMP can ask for this list at any time.</p><div class="tablewrap"><table><thead><tr><th>Requester</th><th>Organisation</th><th>Role</th><th>Requested</th><th>Status</th><th>Decided</th><th>Events</th><th>Last access</th></tr></thead><tbody>' + (inv || '<tr><td colspan="8" class="muted">No requests yet.</td></tr>') + '</tbody></table></div><p style="margin-top:10px"><button type="button" class="btn ghost sm" data-act="export-access">Download inventory and log (JSON)</button></p></div>' +
      '<div class="card"><h2>Monthly access summaries</h2><p class="lede">Summaries are kept for at least six months (rule CDS-TRC-ACL). The raw event list keeps the latest 1,000 events for each party.</p><div class="tablewrap"><table><thead><tr><th>Month</th><th>Events</th><th>Parties</th><th>By event</th></tr></thead><tbody>' + (sumRows || '<tr><td colspan="4" class="muted">No events yet.</td></tr>') + '</tbody></table></div></div>' +
      '<div class="card"><h2>Denied requests: notice to FedRAMP</h2><p class="lede">Rule CDS-UTC-AAD sets a 5 business day limit for telling FedRAMP about a denied agency request. The due date is set when the request is denied.</p><div class="tablewrap"><table><thead><tr><th>Requester</th><th>Organisation</th><th>Denied</th><th>Notice due</th></tr></thead><tbody>' + (due || '<tr><td colspan="4" class="muted">No denied requests.</td></tr>') + '</tbody></table></div></div>';
  }

  async function loadAdmin() {
    try { adminCache.reqs = await store.allRequests(); adminCache.grants = await store.allGrants(); var ids = adminCache.reqs.map(function (r) { return r.id; }); if (ids.indexOf(me.id) < 0) ids.push(me.id); adminCache.log = await store.allLog(ids); adminCache.sum = await store.summaries(ids); } catch (e) { adminMsg = "Could not read access data: " + (e && e.message || e); }
  }

  async function render() {
    renderTabs();
    document.querySelectorAll("section.panel").forEach(function (s) { s.hidden = s.id !== "p-" + view; });
    var el = $("#p-" + view);
    if (view === "admin") await loadAdmin();
    el.innerHTML = ({ overview: overview, indicators: indicators, subprocessors: subprocessors, documents: documents, rules: rulesView, access: accessView, admin: adminView })[view]();
    $("#foot").innerHTML = "<div>" + esc(D.company) + " is a fictional company. " + (me.mode === "claude" ? "Access control uses the signed-in Claude account." : "Demo mode: no server, so access control is only a demonstration.") + "</div>" +
      (me.mode === "local" ? '<div style="margin-top:6px"><button type="button" class="btn ghost sm" id="adm-toggle">' + (me.admin ? "Leave admin demo" : "Admin demo sign-in") + "</button></div>" : (me.admin ? '<div style="margin-top:6px"><button type="button" class="btn ghost sm" id="vis-toggle">' + (me.asVisitor ? "Return to admin view" : "Preview as visitor") + "</button></div>" : ""));
  }

  async function go(v) { view = v; if (v !== "documents") openDoc = null; try { history.replaceState(null, "", "#" + v); } catch (e) {} await refreshAccess(); render(); window.scrollTo(0, 0); }

  /* ---------- events ---------- */
  document.addEventListener("click", async function (e) {
    var t = e.target.closest("button,tr.row,a[href^='#']"); if (!t) return;
    if (t.matches("a[href^='#']")) { e.preventDefault(); go(t.getAttribute("href").slice(1)); return; }
    if (t.dataset.v) { go(t.dataset.v); return; }
    if (t.dataset.themeGo) { themeFilter = t.dataset.themeGo; statusFilter = ""; openKsi = null; go("indicators"); return; }
    if (t.dataset.ksi) { openKsi = openKsi === t.dataset.ksi ? null : t.dataset.ksi; render(); return; }
    if (t.dataset.doc) { openDoc = t.dataset.doc; var d = D.docs.find(function (x) { return x.id === openDoc; }); if (d && d.tier === "gated") { store.log("document_viewed", d.name); } render(); window.scrollTo(0, 0); return; }
    if (t.dataset.act === "close-doc") { openDoc = null; render(); return; }
    if (t.dataset.act === "goto-access") { go("access"); return; }
    if (t.dataset.act === "export-access") {
      var blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), requests: adminCache.reqs, grants: adminCache.grants, events: adminCache.log, monthly_summaries: adminCache.sum }, function (k, v) { return k === "users" ? Object.keys(v) : v; }, 2)], { type: "application/json" });
      try { if (window.claude && window.claude.use) { var dl = await window.claude.use("downloads"); if (dl) { await dl.save({ filename: "trust-center-access-records.json", data: await blob.text() }); return; } } } catch (err) { /* fall back to a plain link */ }
      try { var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "trust-center-access-records.json"; document.body.appendChild(a); a.click(); a.remove(); } catch (err) { adminMsg = "Download is blocked in this view."; render(); }
      return;
    }
    if (t.id === "adm-toggle") { var s = L(); s.admin = !s.admin; lsWrite(s); me.admin = s.admin; if (!me.admin && view === "admin") view = "overview"; render(); return; }
    if (t.id === "vis-toggle") { me.asVisitor = !me.asVisitor; if (me.asVisitor && view === "admin") view = "overview"; await refreshAccess(); render(); return; }
    if (t.dataset.ad) {
      var id = t.dataset.id, req = adminCache.reqs.find(function (r) { return r.id === id; }) || {}, now = new Date();
      var g = { status: t.dataset.ad === "approve" ? "approved" : t.dataset.ad === "deny" ? "denied" : "revoked", decidedAt: now.toISOString(), decidedBy: me.name || me.id };
      if (g.status === "denied") g.fedrampNoticeDue = addBusinessDays(now, 5).toISOString();
      if (g.status === "approved") g.expires = new Date(now.getTime() + GRANT_DAYS * 864e5).toISOString();
      try { await store.putGrant(id, g); adminMsg = (req.name || id) + ": " + g.status + "."; await store.log("access_" + g.status, (req.name || id) + " at " + (req.org || "") + ", decided by " + (me.name || "admin"), id, req.name); } catch (err) { adminMsg = "Could not save: " + (err && err.message || err); }
      render(); return;
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "f-rq") { ruleQ = e.target.value; render(); return; }
    if (e.target.id === "f-party") { ruleParty = e.target.value; render(); return; }
    if (e.target.id === "f-force") { ruleForce = e.target.value; render(); return; }
    if (e.target.id === "f-theme") { themeFilter = e.target.value; openKsi = null; render(); }
    if (e.target.id === "f-status") { statusFilter = e.target.value; openKsi = null; render(); }
  });
  document.addEventListener("submit", async function (e) {
    if (e.target.id !== "reqform") return;
    e.preventDefault();
    var o = { name: $("#r-name").value.trim(), email: $("#r-email").value.trim(), org: $("#r-org").value.trim(), role: $("#r-role").value, purpose: $("#r-purpose").value.trim(), nda: true, submitted: new Date().toISOString() };
    var msg = $("#r-msg"); msg.textContent = "Sending...";
    try {
      await store.putRequest(me.id, o);
      if (!me.name) me.name = o.name;
      await store.log("request_submitted", o.org + ", " + o.role);
      await refreshAccess(); render();
    } catch (err) { msg.textContent = "Could not send the request: " + (err && err.message || err); }
  });
  window.addEventListener("hashchange", function () { var v = location.hash.slice(1); if (TABS.some(function (t) { return t[0] === v; }) && v !== view) { view = v; render(); } });

  /* ---------- live data: use repository files when reachable ---------- */
  async function tryJson(name) {
    var urls = [RAW + name];
    for (var i = 0; i < urls.length; i++) {
      try { var c = new AbortController(); var tm = setTimeout(function () { c.abort(); }, 4000); var r = await fetch(urls[i], { signal: c.signal, cache: "no-store" }); clearTimeout(tm); if (r.ok) return await r.json(); } catch (e) {}
    }
    return null;
  }
  async function loadLive() {
    var k = await tryJson("latest.json"); if (!k || !Array.isArray(k.ksis)) return;
    var byId = {}; D.ksis.forEach(function (x) { byId[x.id] = x; });
    k.ksis.forEach(function (n) { var x = byId[n.id]; if (!x) return; x.status = n.status; x.gap = n.coverage_gap || null; x.note = n.coverage_note || null;
      x.methods = (n.methods || []).map(function (m) { return { id: m.method_id, kind: m.kind, status: m.status, description: m.description, expected: m.expected, observed: m.observed, findings: (m.findings || []).map(function (f) { return typeof f === "string" ? f : JSON.stringify(f); }) }; }); });
    D.summary = k.summary || D.summary; D.generated = k.generated_at || D.generated; dataSource = "live";
    var h = null;
    if (Array.isArray(h) && h.length) { D.history = h.map(function (d) { var c = { pass: 0, partial: 0, fail: 0, not_implemented: 0 }; Object.keys(d.ksi_status).forEach(function (q) { c[d.ksi_status[q]]++; }); return { d: d.date, s: d.synthetic, pass: c.pass, partial: c.partial, fail: c.fail, not_implemented: c.not_implemented }; }); }
  }

  (async function boot() {
    $("#notice-text").textContent = D.notice;
    var h = location.hash.slice(1); if (TABS.some(function (t) { return t[0] === h; })) view = h;
    await initIdentity(); await refreshAccess(); render();
    await loadLive(); if (dataSource === "live") render();
  })();
})();
</script>
