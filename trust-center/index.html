<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky brand bar over a single column. Overview first, then tabs for indicators, subprocessors, documents, access. */
:root {
  --ink: #0E1A2B;
  --signal: #F2A33A;
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --line: #D9E0E8;
  --text: #14202F;
  --muted: #5B6878;
  --pass: #1F8A5B;
  --partial: #B7791F;
  --fail: #C23B3B;
  --none: #8A96A6;
  --pass-bg: #E3F3EB;
  --partial-bg: #FBF0DC;
  --fail-bg: #F9E5E5;
  --none-bg: #EAEEF3;
  --focus: #B7791F;
  --head: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A121E; --surface: #111C2C; --line: #223248; --text: #E6ECF3; --muted: #93A1B3;
    --pass: #4CC38A; --partial: #E3B341; --fail: #F07178; --none: #6B7A8E;
    --pass-bg: #12301F; --partial-bg: #33280F; --fail-bg: #3A1A1C; --none-bg: #1B2838; --focus: #F2A33A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A121E; --surface: #111C2C; --line: #223248; --text: #E6ECF3; --muted: #93A1B3;
  --pass: #4CC38A; --partial: #E3B341; --fail: #F07178; --none: #6B7A8E;
  --pass-bg: #12301F; --partial-bg: #33280F; --fail-bg: #3A1A1C; --none-bg: #1B2838; --focus: #F2A33A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--body); margin: 0; }
h1, h2, h3 { font-family: var(--head); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-size: 0.86em; }
.muted { color: var(--muted); }

.notice { background: var(--ink); color: #F5F7FA; font-size: 13px; padding-block: 8px; }
.notice .wrap { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.notice b { color: var(--signal); font-weight: 600; letter-spacing: .04em; }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand .word { font: 600 19px/1 var(--head); letter-spacing: -0.02em; }
.brand .sub { font-weight: 400; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
nav.tabs button { background: none; border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
nav.tabs button:hover { color: var(--text); background: var(--none-bg); }
nav.tabs button[aria-current="page"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--signal); border-radius: 6px 6px 0 0; }
.who { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

main { padding-block: 28px 56px; display: grid; gap: 28px; }
section.panel[hidden] { display: none; }
.hero { display: grid; gap: 10px; padding-top: 4px; }
.hero h1 { font-size: clamp(26px, 4.5vw, 38px); line-height: 1.12; max-width: 22ch; }
.hero p { max-width: 62ch; color: var(--muted); margin: 0; }
.stamp { font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.badge-src { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.card h2 { font-size: 17px; margin-bottom: 4px; }
.card .lede { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 14px; }
.count { border-left: 3px solid var(--c); padding-left: 10px; }
.count b { display: block; font: 600 28px/1.1 var(--head); font-variant-numeric: tabular-nums; }
.count span { font-size: 13px; color: var(--muted); }
.bar-stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--none-bg); }
.bar-stack i { display: block; height: 100%; }
.seg-pass { background: var(--pass); } .seg-partial { background: var(--partial); } .seg-fail { background: var(--fail); } .seg-none { background: var(--none); }

.themes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.theme { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface); text-align: left; cursor: pointer; display: grid; gap: 6px; }
.theme:hover { border-color: var(--signal); }
.theme .t { font: 600 14px/1.25 var(--head); }
.theme .k { font-size: 12px; color: var(--muted); }
.theme .bar-stack { height: 8px; }

.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.pass { color: var(--pass); background: var(--pass-bg); }
.pill.partial { color: var(--partial); background: var(--partial-bg); }
.pill.fail { color: var(--fail); background: var(--fail-bg); }
.pill.not_implemented, .pill.none, .pill.pending, .pill.public { color: var(--muted); background: var(--none-bg); }
.pill.approved, .pill.open { color: var(--pass); background: var(--pass-bg); }
.pill.denied, .pill.revoked, .pill.expired, .pill.gated { color: var(--fail); background: var(--fail-bg); }
.pill.gated { color: var(--partial); background: var(--partial-bg); }

.tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.tools select, .tools input { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--none-bg); }
tr.detail td { background: var(--bg); }
.detail-grid { display: grid; gap: 12px; }
.method { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.method .h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.gap { border-left: 3px solid var(--partial); padding: 6px 10px; background: var(--partial-bg); border-radius: 0 6px 6px 0; font-size: 13px; }
.locked { color: var(--muted); font-style: italic; font-size: 13px; }

.btn { background: var(--ink); color: #F5F7FA; border: 1px solid var(--ink); border-radius: 7px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { box-shadow: 0 0 0 2px var(--signal); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.ghost:hover { box-shadow: none; border-color: var(--signal); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.bad { background: transparent; color: var(--fail); border-color: var(--fail); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
:root[data-theme="dark"] .btn:not(.ghost):not(.bad) { background: var(--signal); color: #0E1A2B; border-color: var(--signal); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.ghost):not(.bad) { background: var(--signal); color: #0E1A2B; border-color: var(--signal); } }

form.req { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
form.req .full { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
label.f input, label.f select, label.f textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-weight: 400; min-width: 0; width: 100%; }
label.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--none-bg); }
.msg.err { background: var(--fail-bg); color: var(--fail); }
.msg.ok { background: var(--pass-bg); color: var(--pass); }

.doclist { display: grid; gap: 10px; }
.doc { display: flex; gap: 14px; align-items: center; justify-content: space-between; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; flex-wrap: wrap; }
.doc .n { font-weight: 600; font-family: var(--head); }
.doc .d { font-size: 13px; color: var(--muted); }
.doc > div:first-child { min-width: 0; flex: 1 1 260px; }

.reader { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 20px 24px; overflow-x: auto; }
.reader .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; position: sticky; top: 0; background: var(--surface); }
.md h1 { font-size: 24px; margin: 8px 0 10px; } .md h2 { font-size: 19px; margin: 22px 0 8px; } .md h3 { font-size: 16px; margin: 18px 0 6px; } .md h4 { font-size: 14px; margin: 14px 0 4px; }
.md p, .md li { max-width: 78ch; }
.md code { font-family: var(--mono); font-size: .88em; background: var(--none-bg); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--none-bg); padding: 12px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--signal); color: var(--muted); }
.md table { font-size: 13px; margin: 10px 0; display: block; overflow-x: auto; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

svg.chart text { fill: var(--muted); font: 11px var(--body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
footer { border-top: 1px solid var(--line); padding-block: 20px 32px; font-size: 13px; color: var(--muted); }
@media (max-width: 640px) { nav.tabs { margin-left: 0; width: 100%; } .bar .wrap { gap: 8px; } }
@media (prefers-reduced-motion: no-preference) { .theme, .btn { transition: border-color .15s, box-shadow .15s; } }
</style>

he review cadence and was recorded by the POL-RPL owner","expected":"<= 90 days since last review; reviewed by Platform Lead","observed":"3 days","findings":[]}]},{"id":"KSI-RPL-TRC","theme":"RPL","name":"Testing Recovery Capabilities","status":"pass","gap":null,"note":"Limit: methods check recorded restore test results, their age and the test history; they do not run a restore. The test cadence differs between RPL-4 and SD-003 (issue #20); the history check uses the 90-day cycle in environment/recovery-objectives.json.","methods":[{"id":"trc-iac-restore-test-plan","kind":"static","status":"pass","description":"A recovery module exists and a restore test cadence at or under the objective is set","expected":"module declared, cadence <= objective","observed":"0 finding(s)","findings":[]},{"id":"trc-live-restore-results","kind":"live","status":"pass","description":"A restore test inside the cadence met the RTO and RPO","expected":"<= cadence, RTO and RPO met","observed":"0 finding(s)","findings":[]},{"id":"trc-live-test-history","kind":"live","status":"pass","description":"Restore tests ran every cycle for the last year, each passing within the RTO","expected":"one test per restore_test_cadence_days, no gap over the cycle, all within RTO","observed":"0 finding(s)","findings":[]}]},{"id":"KSI-SCR-MIT","theme":"SCR","name":"Mitigating Supply Chain Risk","status":"pass","gap":null,"note":"Limit: methods check review recency, stale risks and contract clauses; they do not judge the quality of each risk assessment.","methods":[{"id":"mit-iac-supply-chain-policy","kind":"static","status":"pass","description":"An SBOM, vendor notification clauses and a quarterly risk review are defined","expected":"SBOM, clause, quarterly","observed":"0 finding(s)","findings":[]},{"id":"mit-live-supply-chain-risks","kind":"live","status":"pass","description":"Risks were reviewed this quarter, none is stale and every third party has a notification clause","expected":"review <= 90d, 0 stale, all "findings":[]},{"id":"vcm-live-tls-scan","kind":"live","status":"pass","description":"Public endpoints and every data flow in the scope record use TLS 1.2+ with valid certificates and no weak ciphers","expected":"TLS1.2+, valid certificates, 0 weak ciphers","observed":"3 endpoint(s), 31 flow(s) checked, 0 finding(s)","findings":[]},{"id":"vcm-live-client-authentication","kind":"live","status":"pass","description":"Every internal flow authenticates its client: mutual TLS between services, IAM-signed requests to AWS services","expected":"every internal flow authenticated by the expected method","observed":"0 finding(s)","findings":[]}]},{"id":"KSI-SVC-VRI","theme":"SVC","name":"Validating Resource Integrity","status":"pass","gap":null,"note":null,"methods":[{"id":"vri-iac-signing","kind":"static","status":"pass","description":"Images are signed, verified at deploy and immutable","expected":"signing, verification, immutable tags","observed":"0 finding(s)","findings":[]},{"id":"vri-live-image-integrity","kind":"live","status":"pass","description":"Every running image is signed and digest-verified","expected":"100% signed and verified","observed":"0 finding(s)","findings":[]},{"id":"vri-live-artifact-signatures","kind":"live","status":"pass","description":"Signing is required for every artifact type and every deployed IaC module is signed and verified","expected":"iac_module in signing_required_for, all signed and verified","observed":"0 finding(s)","findings":[]}]}],"history":[{"d":"2026-11-18","s":false,"pass":4,"partial":0,"fail":5,"not_implemented":37},{"d":"2026-11-19","s":false,"pass":1,"partial":3,"fail":5,"not_implemented":37},{"d":"2026-11-20","s":false,"pass":35,"partial":0,"fail":2,"not_implemented":9},{"d":"2026-11-21","s":false,"pass":36,"partial":0,"fail":2,"not_implemented":8},{"d":"2026-11-22","s":false,"pass":38,"partial":0,"fail":2,"not_implemented":6},{"d":"2026-11-23","s":false,"pass":38,"partial":0,"fail":2,"not_implemented":6},{"d":"2026-11-24","s":false,"pass":38,"partial":0,"fail":2,"not_implemented":6},{"d":"2026-11-25","s":false,"pass":38,"partial":0,"fail":2,"not_implemented":6}],"tpr":[{"id":"TPR-T1","name":"Mobile push notification service","type":"Mobile push notification service","auth":"To be verified before provider selection","usage":"Production sends push messages to registered device tokens. Messages carry an alert reference ID and fixed text only. Tokens are stored by the provider for delivery.","impact":"Provider could see which devices received an alert and when. A payload mistake could expose summary text.","mitigation":["Reference-only payload policy (PF3) with an outbound payload linter","Per-tenant ability to disable push","Token rotation on app reinstall and offboarding"],"data":["D1","D3"]},{"id":"TPR-T2","name":"Transactional email delivery service","type":"Transactional email delivery service","auth":"To be verified before provider selection","usage":"Production sends reference-only emails with a login-required link. Sending domain is authenticated with SPF, DKIM and DMARC.","impact":"Provider sees recipient addresses and that a page occurred. Email is stored in mailboxes the agency controls, outside Orrinwick.","mitigation":["Reference-only content (PF3)","TLS required to the provider and enforced to recipients where supported","Provider retention minimized by contract"],"data":["D1","D3"]},{"id":"TPR-T3","name":"Telephony provider (SMS and voice)","type":"Telephony provider (SMS and voice)","auth":"To be verified before provider selection; see OQ1","usage":"Production sends fixed-template SMS and voice nudges that say an alert needs attention and to open the app. Phone numbers are sent in E.164 format only.","impact":"Provider and carriers see the personal or work phone number and the timing of pages. Carrier networks are not under anyone's control (X5).","mitigation":["Content-free design (PF3): no D4, no tenant or alert identifiers in the message","Number minimization and no use of to production.","mitigation":["Phishing-resistant factors only (WebAuthn or platform authenticators)","Sign-in policy kept as code and checked by validator apm-live-user-factors","Two break-glass accounts held offline with alerts on use"],"data":[]},{"id":"TPR-E9","name":"Endpoint detection and response and device management","type":"Hosted endpoint detection and device management service","auth":"To be verified before provider selection","usage":"Reports endpoint health and enforces device policy for managed administrative endpoints (E8). Orrinwick configures policy and receives telemetry.","impact":"Provider telemetry describes staff devices, not federal data. Loss or compromise of the service removes protection from E8.","mitigation":["Gateway (E6) denies sessions from endpoints that fail posture checks","Agent tamper protection on","Daily check that every E8 device reports in"],"data":[]}],"docs":[{"id":"brand-guidelines","name":"Brand Guidelines","note":"Name, mark, colour and voice.","tier":"public","md":"# Orrinwick brand guidelines\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented.\n\n## Idea\n\n\"Orrin\" is an old given name. \"-wick\" is the English place-name ending for a settlement or outpost, and a wick is also what you light. The brand is a dependable outpost that sends up a signal. The tone is calm, plain and exact. Orrinwick sells a service that people rely on at 3 a.m., so the design avoids alarm colours except for real faults.\n\n## Mark\n\nA rounded square in ink blue holds a small amber point with three arcs that fade outward, standing on a short base line. The point is the alert source. The arcs are the signal reaching a person. File: `trust-center/brand/logo-mark.svg`.\n\nThe wordmark is \"Orrinwick\" in Space Grotesk, weight 600, set beside the mark. Product names follow in a lighter weight, for example \"Orrinwick Beacon\" and \"Trust Center\".\n\nClear space around the mark equals the width of the base line. The minimum size is 20 px.\n\n## Colour\n\n| Name | Light | Dark | Use |\n|---|---|---|---|\n| Ink | `#0E1A2B` | `#0A121E` | Mark tile, page ground in dark theme, headings |\n| Signal | `#F2A33A` | `#F2A33A` | Mark, one accent per screen, focus rings |\n| Mist | `#F5F7FA` | `#111C2C` | Page ground in light theme, card surface in dark theme |\n| Slate | `#5B6878` | `#93A1B3` | Secondary text |\n| Pass | `#1F8A5B` | `#4CC38A` | Passing checks |\n| Partial | `#B7791F` | `#E3B341` | Partial results |\n| Fail | `#C23B3B` | `#F07178` | Failing checks |\n| None | `#8A96A6` | `#6B7A8E` | No automated check yet |\n\nSignal amber is the brand accent. Status colours carry meaning only and are never used for decoration.\n\n## Type\n\n- Headings: Space Grotesk, 600.\n- Body: Inter, 400 and 500.\n- Identifiers and code: JetBrains Mono.\n\n## Voice\n\nPlain, direct and specific. State what a control does and what evidence proves it. Mark simulated results as simulated.\n"},{"id":"company-and-offering","name":"Company And Offering","note":"What Orrinwick Beacon is, who uses it and why the company is pursuing FedRAMP 20x.","tier":"public","md":"# Orrinwick Labs, Inc. and Orrinwick Beacon\n\n> **FICTIONAL DEMO DOCUMENT.** Orrinwick Labs, Inc. is an invented company created for a FedRAMP 20x learning project. Nothing here describes a real organization, product, customer or certification.\n\n| | |\n|---|---|\n| Document | Company and offering overview (step 1 of the scoping sequence) |\n| Status | Draft v0.2 (recovery model changed from warm standby to backup and restore) |\n| Owner | GRC Lead (fictional) |\n| Feeds into | Federal customer data identification (`MAS-CSO-IIR`), then information flows (`MAS-CSO-FLO`) |\n\n---\n\n## 1. The company\n\n**Orrinwick Labs, Inc.** builds software that helps government security and IT operations teams get the right person's attention when something important happens.\n\n**The name.** \"Orrin\" is an old given name, and \"-wick\" is the English place-name ending for a settlement or outpost. A wick is also what you light. The brand idea is a dependable outpost that sends up a signal. The tone is calm and understated, which suits a product people rely on at 3 a.m.\n\n| Fact (fictional) | Value |\n|---|---|\n| Founded | 2022 |\n| Headquarters | Remote-first, US-based staff only |\n| Headcount | About 35 (engineering 16, security and compliance 4, support 5, go-to-market 6, other 4) |\n| Customers | Federal civilian agencies and a small number of defense contractors |\n| Funding | Seed funded, targeting first federal contracts |\n| Leadership | CISO Alex Rivera, GRC Lead Sam Okafor, Platform Lead Jordan Lee (all fictional) |\n\n**Why federal.** Government teams run on-call rotations for security incidents, vulnerability reports and outages, but many still manage them with spreadsheets, group chats and tools never designed for sensitive events. Orrinwick's founders came from federal security operations and built Beacon to answer two questions: who do we wake up, and how do we prove we did.\n\n---\n\n## 2. The offering: Orrinwick Beacon\n\n**Beacon is a cloud service that receives security-relevant alerts from an agency's other tools, decides who needs to act, reaches that person reliably, and keeps a tamper-evident record of what happened.**\n\nIn one line: *on-call routing built for sensitive security events, with an audit trail.*\n\n### 2.1 What Beacon does\n\n| Capability | Description |\n|---|---|\n| Alert intake | Receives alert events from customer tools by API and webhook (scanners, ticketing systems, vulnerability disclosure platforms, SIEM and EDR alert outputs). |\n| Routing rules | Maps an alert's type, severity and affected team to a responder or escalation policy. |\n| On-call schedules | Rotations, overrides, handoffs and time-zone aware coverage. |\n| Escalation | If nobody acknowledges within a set time, Beacon escalates to the next person or group. |\n| Notification | Delivers through the Beacon mobile app (push), email, and, as content-free nudges, SMS and voice call (see 2.3). |\n| Acknowledge and resolve | Responders acknowledge, reassign, annotate and resolve from the app or console. |\n| Audit trail | Every receipt, routing decision, notification attempt, acknowledgement and administrative change is recorded and exportable. |\n| Reporting | Response-time metrics and coverage reports by team, for agency leadership and audits. |\n| Tenant administration | Agency admins manage users, roles, integrations, routing policy and retention through the console and API. |\n\n### 2.2 What Beacon deliberately does not do\n\nThese limits keep the service small, and they keep the assessment boundary small too.\n\n- **It does not ingest logs or telemetry.** Beacon receives discrete *alerts* that another tool has already decided are worth a human's attention. It is not a SIEM and stores no raw event streams.\n- **It does not act on agency systems.** No remote commands, no automated remediation, no credentials to agency environments.\n- **It does not store full incident records.** Beacon holds the alert and the response trail. The system of record for the incident stays in the agency's ticketing or case tool.\n- **It does not send sensitive content over SMS or voice.** See 2.3.\n\n### 2.3 Payload handling principle\n\nAlert payloads can carry operational detail about agency systems, so Beacon treats them as sensitive. Each tenant chooses a payload mode per integration:\n\n| Mode | What is stored and shown | Default |\n|---|---|---|\n| **Reference-only** | Alert ID, severity, category, link back to the source tool. No descriptive text. | Yes |\n| **Standard** | Reference-only plus a short title and summary, shown only to authenticated users in the app and console. | No, opt-in |\n\nAcross all modes:\n\n- Push, email, SMS and voice notifications never include the summary. SMS and voice say only that an alert needs attention and to open the app.\n- Responder contact details (work and optional personal mobile numbers) are held for delivery and are visible only to tenant admins and the responder.\n- This principle is the **first Security Decision Record entry** (SD-001) and drives the third-party telephony decision in the scoping document.\n\n### 2.4 Users\n\n| Persona | What they do in Beacon |\n|---|---|\n| **Responder** (SOC analyst, sysadmin, vulnerability triager) | Receives, acknowledges and resolves alerts; sets their own contact methods and availability. |\n| **Team lead** | Owns schedules and escalation policies; reviews coverage. |\n| **Tenant administrator** | Manages users, roles, integrations, payload modes, retention. |\n| **Auditor or leadership viewer** | Read-only access to reports and the audit trail. |\n| **Integration** (non-human) | A customer tool sending alerts by API key or signed webhook. |\n| **Orrinwick operator** | Orrinwick staff who run the service. They have no routine access to tenant content. |\n\n### 2.5 Illustrative scenario\n\n1. An agency's vulnerability scanner flags a critical internet-facing finding and sends an alert to Beacon.\n2. Beacon matches the routing rule \"critical, external, web tier\" to the on-call web security engineer.\n3. The engineer's phone gets a push notification and, after two minutes without acknowledgement, a content-free SMS nudge.\n4. Still no response, so Beacon escalates to the team lead and records each step.\n5. The lead acknowledges in the app, reads the summary (standard mode, authenticated), and opens the ticket in the agency's own case tool through the link.\n6. Later, the agency exports the audit trail to show how quickly a critical finding was owned.\n\n---\n\n## 3. How Beacon is delivered (high level)\n\nThe service is made of:\n\n- **Web console and mobile app** for responders and administrators\n- **Public API and webhook endpoints** for integrations\n- **Routing and escalation engine**\n- **Notification workers** that send push, email, SMS and voice\n- **Tenant data store** for users, schedules, policies, alerts and audit records\n- **Identity layer** for agency single sign-on and Orrinwick's own workforce access\n- **Operations tooling:** logging, monitoring, backup, deployment pipeline, secrets management\n\n**Hosting model (fictional):** multi-tenant SaaS on a US public cloud, multi-AZ production in a primary region, with encrypted backups replicated to a second US region. Recovery is by backup and restore: no standing environment exists in the second region, and one is built on demand from infrastructure code (decision SD-003). Objectives for the fictional service are an 8 hour recovery time and a 4 hour recovery point. All production data stays in the United States.\n\n**Third parties Beacon depends on (to be assessed in the scoping document):** a mobile push service, an email delivery service, and a telephony provider for SMS and voice.\n\n---\n\n## 4. Why FedRAMP 20x\n\nFederal agencies may only use cloud services that meet FedRAMP requirements when those services handle federal information. Beacon handles two kinds of information that agencies treat as sensitive:\n\n1. **Personal contact information** for federal employees and contractors (names, work email, work and personal mobile numbers, on-call schedules).\n2. **Operational security information**: alert metadata and, in standard mode, short descriptions that reveal which agency systems have problems and when.\n\nOrrinwick is targeting **FedRAMP 20x Class C**, the third of four certification classes, which the official rules describe as rising from minimal assurance (Class A) to significant assurance (Class D). The rules do not map classes to FIPS 199 impact levels, so Class C is a risk and business judgment. The second category, security-relevant operational detail about agency systems, warrants more than minimal assurance. *This is a preliminary position. The next documents identify the federal customer data in detail and assign security categories separately before the target class is confirmed.*\n\n---\n\n## 5. Open questions for the next step\n\n| # | Question | Why it matters |\n|---|---|---|\n| 1 | Which telephony provider handles SMS and voice, and is it inside or outside the assessed offering? | Third-party information resources (`MAS-CSO-TPR`) |\n| 2 | Is reference-only payload mode enough to keep alert content out of the notification channels entirely? | Shapes information flows and categorization |\n| 3 | Do integrations ever send attachments or raw artifacts, and if so, do we reject them? | Beacon must not become a general data store |\n| 4 | How are customer-supplied personal mobile numbers protected and who can see them? | Confidentiality of the most personal data class |\n| 5 | What availability does a customer need from an alerting service, and what does failure cost them? | Availability impact reasoning |\n| 6 | Does the mobile app cache alert content on devices? | Extends the information resources to endpoints we do not control |\n\n---\n\n## Next document\n\n`federal-data-and-information-resources.md` records the federal customer data categories and the decision for each information resource.\n"},{"id":"cryptographic-modules","name":"Cryptographic Modules","note":"Cryptographic modules in use.","tier":"gated","md":"# Cryptographic Module Inventory\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification.\n\n| | |\n|---|---|\n| Status | Outline. Author to verify each row |\n| Rules | `CMU-CSO-CMD` (document modules), `CMU-CSO-CAT` (tenant defaults), `CMU-CSO-UVM` (validated modules, Class C) |\n\nDo not claim validated status until you have checked the module certificate against the CMU rules in `rules-matrix.md`.\n\n| Use | Module or service | Validation status | Notes |\n|---|---|---|---|\n| Storage encryption | Cloud key management service keys | TODO verify | Rotation enabled |\n| Transport (TLS) | Load balancer TLS policy | TODO verify | TLS 1.2 or later |\n| Backup encryption | Backup vault keys (us-east-1 and us-west-2) | TODO verify | Separate key per region |\n| Signing | Build and image signing | TODO verify | Used by SVC-VRI checks |\n| TODO (author) | | | |\n\n## Tenant defaults (`CMU-CSO-CAT`)\nTODO (author): state whether new agency tenants use validated cryptographic services by default.\n\n## Update stream (`CMU-CSO-UVM`)\nTODO (author): how Orrinwick tracks module updates and certificate expiry.\n"},{"id":"customer-agreement-standard","name":"Customer Agreement Standard","note":"","tier":"gated","md":"# Standard customer agreement: data terms (extract)\n\n> FICTIONAL DEMO PROJECT. Orrinwick Labs, Inc. and Orrinwick Beacon are invented. This is not a real agreement and is not legal text.\n\nStatus: Approved by the demo author, 23 November 2026. Version 2026-11.\n\nThis extract records the data terms that the validators check. The machine-readable copy is `environment/customer-terms.json`.\n\n## Data deletion\n\n| Term | Value |\n|---|---|\n| Deletion deadline | 30 calendar days from the customer's written request |\n| Retention after contract end | Orrinwick deletes all customer data 30 calendar days after the contract ends, with no request needed. After that date the customer does not need to take any action to have its data removed |\n| Scope | Customer data in production stores and in backups |\n| Backups | Copies in backup vaults are deleted by the deadline or expire under the backup retention period, whichever is sooner |\n| Confirmation | Orrinwick confirms deletion in writing and keeps a record of the request |\n| Record location | `environment/live-state.json#data_removal_requests` (demo) |\n\n## Checks\n\nKSI-SVC-RUD method `rud-terms-agreement` compares the removal process target and every recorded request with the deletion deadline above.\n"},{"id":"federal-data-and-information-resources","name":"Federal Data And Information Resources","note":"Federal customer data categories and the decision for each information resource.","tier":"gated","md":"# Federal Customer Data and Information Resource Inventory\n\n> **FICTIONAL DEMO DOCUMENT.** Orrinwick Labs, Inc. and every platform choice below are invented for a FedRAMP 20x learning project. Platforms are described generically on purpose; no real vendor's FedRAMP status is implied.\n\n| | |\n|---|---|\n| Document | Federal customer data identification and information resource inventory (step 2 of the scoping sequence) |\n| Status | Draft v0.3 (v0.2 corrections to the rule text; recovery strategy added, see section 0) |\n| Rule addressed | `MAS-CSO-IIR` (identify information resources), with inputs to `MAS-CSO-TPR` and `MAS-CSO-MDI` |\n| Builds on | `company-and-offering.md` |\n| Feeds into | Information flows and security categories (`MAS-CSO-FLO`), then the Minimum Assessment Scope |\n\n## 0. Changes in v0.2\n\nRe-reading the official rule text and definitions showed four errors in v0.1:\n\n1. **\"Federal customer data\" was used too loosely.** The official definition **excludes** account information, service metadata, analytics and telemetry generated by the provider. Section 2 now says which categories are federal customer data, which are metadata, and which are mixed. Metadata still comes into scope through `MAS-CSO-MDI`.\n2. **Information resources include people and processes.** Section 4.5 adds staff roles, policies and procedures.\n3. **The Beacon mobile app is outside FedRAMP scope.** Software delivered for installation on agency devices and not operated in a shared responsibility model is excluded. P10 now covers only the backend; the app is a supplement item (`MAS-CSO-SUP`).\n4. **Billing receives per-tenant usage counts**, which is metadata about federal customer data. C4 moves from \"Out\" to \"Out, conditional\". Staff devices are also split into managed administrative endpoints (in) and personal or non-admin devices (out, conditional).\n\n**Source of truth.** Decisions, flows and security categories now live in `mas/mas-record.json` and are rendered to `minimum-assessment-scope.md`. This document keeps the reasoning and narrative; if the two differ, the JSON record wins.\n\n---\n\n### Changes in v0.3 (recovery strategy)\n\nOption C (backup and restore) was chosen over warm standby, pilot light and multi-AZ only. Encrypted backups replicate to a second US region, so a new in-scope resource **P12** (cross-region backup replica storage) and flow **F43** were added. There is no standing environment in the recovery region. Section 6 records the decision; open questions OQ9 and OQ10 in the scope record cover the on-demand recovery environment and data removal from backups.\n\n---\n\n## 1. Method\n\n`MAS-CSO-IIR` requires the provider to identify every information resource that may touch federal customer data or may affect its confidentiality, integrity or availability. The set identified is the cloud service offering.\n\nSection 2 lists the categories of federal customer data and the preliminary CIA impact of each. Section 3 lists the platforms. Section 4 records a decision and rationale for each platform against the two `MAS-CSO-IIR` questions. Section 5 maps data categories to platforms.\n\nDecision values used:\n\n| Decision | Meaning |\n|---|---|\n| **In** | Part of the cloud service offering and assessed. |\n| **In (3P)** | A third-party information resource in the data path. By the official definition it is not entirely inside the assessed scope, so it is documented under `MAS-CSO-TPR` rather than assessed. |\n| **Out** | Neither handles federal data nor can affect its confidentiality, integrity or availability. Rationale must say why. |\n| **Out, conditional** | Out only while a stated control holds. If the condition fails, it moves in. |\n\nAll impact levels below are **preliminary** and use Low / Moderate / High as working labels. They are confirmed (or changed) when security categories are documented in the information flow step.\n\n---\n\n## 2. Federal customer data categories\n\nIn FedRAMP's definitions, **federal customer data** means the content an agency or its users put into the service. Account information and provider-generated metadata, analytics and telemetry are outside that definition. Read the exact wording in the FedRAMP definitions (FRD) in FedRAMP/rules. Metadata is still pulled into scope by `MAS-CSO-MDI`, so excluding a category from the definition does not take it out of the boundary.\n\n| Status | Categories |\n|---|---|\n| Federal customer data | D1, D2, D3, D4, D10 |\n| Mixed (supplied content plus service-generated records) | D5, D7, D8 |\n| Not federal customer data (account information or telemetry), in scope as metadata | D6, D9 |\n\nSeveral of these are judgment calls (open question OQ7 in the record). Category IDs (D1 to D10) are used throughout the document.\n\n| ID | Category | Examples | Notes |\n|---|---|---|---|\n| D1 | **Responder contact data** | Names, work email, work phone, optional personal mobile number, notification preferences | Personal numbers are the most personal data in the service. |\n| D2 | **Schedules and routing policy** | On-call rotations, overrides, escalation chains, routing rules | Reveals who covers what and when, and how alerts flow. |\n| D3 | **Alert metadata** | Alert ID, timestamp, severity, category, source tool, target team, source link | Present in every payload mode. Included in scope per `MAS-CSO-MDI`. |\n| D4 | **Alert summaries** | Short title and description in standard payload mode | May describe vulnerabilities, incidents or outages in agency systems. |\n| D5 | **Response and audit trail** | Delivery attempts, acknowledgements, reassignments, annotations, admin changes | Also the evidence trail agencies use for audits. |\n| D6 | **Tenant and identity data** | Tenant configuration, user accounts, roles, SSO assertions and mappings, session records | Controls who can see or change everything else. |\n| D7 | **Integration credentials** | API keys, webhook signing secrets, OAuth tokens for customer tools | Compromise lets an attacker send, suppress or forge alerts. |\n| D8 | **Support-derived data** | Screenshots, pasted alert text, ticket contents, call notes from customer support | Created by Orrinwick staff. May contain D1 to D6. |\n| D9 | **Operational telemetry about tenants** | Application logs, traces, error reports, usage metrics that reference tenants or alerts | Often forgotten; can leak D1 to D4 if not scrubbed. |\n| D10 | **Backups and exports** | Database snapshots, object storage versions, customer-requested audit exports | Same data as above in a different place, often with longer life. |\n\n### 2.1 Preliminary CIA impact by category\n\n| ID | Confidentiality impact if lost | Integrity impact if altered | Availability impact if unavailable | Working level (C / I / A) |\n|---|---|---|---|---|\n| D1 | Exposes staff personal numbers and who works in security roles; enables targeting and social engineering. | Wrong numbers send pages to the wrong person or nobody. | Responders cannot be reached; mainly shows up as an alert delivery failure. | Mod / Mod / Mod |\n| D2 | Reveals coverage gaps (for example, nobody on call at weekends) to an adversary. | A tampered schedule or rule silently diverts or drops critical alerts. | Escalation cannot run; alerts have no routing target. | Mod / **High-leaning** / Mod |\n| D3 | Reveals when and how often an agency detects problems and which tools it uses. | Forged or altered metadata can hide or fabricate incidents. | Loss delays triage and reporting. | Mod / Mod / Mod |\n| D4 | Describes weaknesses or incidents in agency systems; direct operational value to an attacker. | Altered text misdirects responders or hides severity. | Responders lose context but can use the source link. | **Mod-High** / Mod / Low |\n| D5 | Shows response timelines and gaps; moderate sensitivity. | Altered trail undermines audit and accountability evidence. | Loss harms audit evidence but not live response. | Mod / Mod / Low |\n| D6 | Account and role data enable account takeover and impersonation. | Role or SSO mapping changes grant access to others' tenants or alerts. | Nobody can sign in to acknowledge alerts. | Mod / **High-leaning** / Mod |\n| D7 | Credential theft lets an attacker forge alerts or read routed content. | Replaced keys let an attacker take over an integration path. | Revoked or lost keys stop alerts reaching Beacon. | **Mod-High** / Mod / Mod |\n| D8 | Same exposure as whatever was pasted, in a weaker-controlled system. | Low direct impact. | Low direct impact. | Mod / Low / Low |\n| D9 | Leaks D1 to D4 through logs and error reports. | Altered logs weaken forensics. | Loss of telemetry delays detection of platform issues. | Mod / Mod / Low |\n| D10 | Same as source data; backups often outlive deletion requests. | Corrupted backups defeat recovery. | Loss prevents recovery from an outage or attack. | Mod / Mod / Mod |\n\n**Observations that shape scope**\n\n- **Availability and integrity matter more here than in a typical SaaS.** Beacon exists to make sure alerts reach people. A silent failure (an alert never routed, or routed to the wrong person) is worse than a confidentiality incident for many customers. The platforms that route, schedule and authenticate are in scope even though they hold little data.\n- **D2, D6 and D7 are control data.** They contain little sensitive content but determine whether the rest of the system can be trusted. Anything that can change them (admin tools, CI/CD, identity) is in scope under the \"impact\" test even if it holds no federal data.\n- **D4 and D7 pull the working level up.** Alert summaries and integration credentials are why the working security categories are Moderate rather than Low. Class selection is a separate decision: the official rules do not equate Class C with a FIPS 199 impact level, so the target class in `company-and-offering.md` stays a preliminary judgment.\n\n---\n\n## 3. Fictional company platform stack\n\nOrrinwick is a cloud-native company with a single production environment on a US public cloud and encrypted backup replicas in a second US region. Platforms are grouped by function; IDs are used in the inventory and the mapping.\n\n| Group | Platforms |\n|---|---|\n| **Production service** | P1 to P13 |\n| **Engineering and operations** | E1 to E10 |\n| **Support and corporate IT** | S1 to S4, C1 to C6 |\n| **Third parties in the data path** | T1 to T5 |\n| **People and processes** | N1 to N7 (section 4.5) |\n\n---\n\n## 4. Information resource inventory and decisions\n\n### 4.1 Production service\n\n| ID | Platform | Purpose | Federal data (D#) | Impact on CIA of federal data | Decision | Rationale |\n|---|---|---|---|---|---|---|\n| P1 | Production cloud accounts and network (IaaS foundation, VPCs, IAM) | Hosts all production resources | All, indirectly | Controls the isolation and access paths to every other production resource | **In** | Foundation for everything; a misconfiguration here affects all three properties. |\n| P2 | Container compute for API, routing engine, notification workers and web console | Runs the application | D1 to D7 in memory and in transit | Application flaws can expose or alter data; downtime stops alerting | **In** | Directly handles federal data. |\n| P3 | Managed relational database | Primary store for tenants, users, schedules, alerts, audit trail | D1 to D7 | Compromise or corruption affects every category | **In** | System of record for federal customer data. |\n| P4 | Object storage | Customer audit exports, attachments if enabled, backup copies in the primary region | D5, D10 | Misconfiguration exposes exports and backups | **In** | Holds federal data at rest. |\n| P5 | Key management service | Encryption keys for database, storage and backups | None directly | Loss or misuse of keys breaks confidentiality (and availability if keys are lost) | **In** | Protects all stored federal data. |\n| P6 | Secrets management service | Stores integration signing secrets, service credentials | D7 | Exposure enables forged alerts | **In** | Holds D7 directly. |\n| P7 | Message queue / job scheduler | Passes alerts to the routing engine and notification jobs | D3, D4 in transit | Queue loss or tampering drops or delays alerts | **In** | Handles alert content and drives availability. |\n| P8 | Load balancer, API gateway and web application firewall | Public entry point for console, API and webhooks | D3, D4, D7 in transit | Bypass or outage exposes or blocks the service | **In** | Terminates customer traffic. |\n| P9 | DNS and certificate management | Service names and TLS certificates | None | Compromise enables traffic interception or redirection | **In** | Can undermine integrity and confidentiality of all traffic. |\n| P10 | Push registration and device token service | Registers responder devices and maps users to push tokens | D1, D3 | Wrong or stolen tokens misdirect or expose notification metadata | **In** (backend only) | The Beacon mobile app is customer-installed software that Orrinwick does not operate in a shared responsibility model, so it is outside FedRAMP scope and recorded as supplement item SUP1. The backend it calls is in. |\n| P11 | Container registry and artifact store | Holds deployable images and libraries | None | Tampered artifacts change what runs in production | **In** | Integrity of everything deployed. |\n| P12 | Cross-region backup replica storage | Encrypted copies of database and object storage backups for recovery | D10 | Exposure leaks a full copy of every category; corrupted replicas defeat recovery | **In** | Holds a full copy of federal customer data at rest. It is the only standing resource in the recovery region. |\n\n### 4.2 Engineering and operations\n\n| ID | Platform | Purpose | Federal data (D#) | Impact on CIA of federal data | Decision | Rationale |\n|---|---|---|---|---|---|---|\n| E1 | Source control (hosted) | Application and infrastructure code | None | Code changes alter production behavior | **In (3P)** | Hosted by another company. Integrity path to production. Documented as TPR-E1. |\n| E2 | CI/CD pipeline | Builds, tests, deploys | None, but holds deploy credentials | Can push arbitrary code to production | **In** | Direct integrity control over the offering. |\n| E3 | Infrastructure as code state and runners | Defines and applies production infrastructure | None, but state may contain secrets | Can alter or destroy production infrastructure | **In** | Same reasoning as CI/CD. |\n| E4 | Production logging, monitoring and alerting stack | Platform health, security events, audit logs of operator actions | D9 (and D3 metadata if not scrubbed) | Needed to detect compromise; may itself hold tenant references | **In** | Handles D9 and supports detection of attacks on the offering. |\n| E5 | Vulnerability scanning and dependency analysis tools | Finds flaws in code, images and infrastructure | None | Tampering could hide real vulnerabilities | **In** | Integrity of the vulnerability detection process (VDR). |\n| E6 | Privileged access management and production access gateway | Brokered, recorded administrator access to production | None directly | Sole route for humans into production | **In** | Gatekeeper for operator access to all categories. |\n| E7 | Workforce identity provider (SSO, MFA) | Authenticates Orrinwick staff | None | Compromise grants access to production tooling | **In (3P)** | Hosted by another company. Controls who can reach everything. Documented as TPR-E7. |\n| E8 | Managed administrative endpoints | Company-managed laptops used to administer production or handle customer data | D8 and cached sessions | Compromised endpoint holds admin sessions | **In** | Any device that can reach production or customer data is in. An earlier draft excluded all laptops, which was too broad. |\n| E9 | Endpoint detection and response (EDR) and device management | Protects and manages staff devices | None | Disabling it removes protection on in-scope endpoints | **In (3P)** | Hosted by another company. Control plane for in-scope endpoints. Documented as TPR-E9. |\n| E10 | Staging and development environments | Testing | None while synthetic only | Becomes in scope if customer data ever enters | **Out, conditional** | Separate accounts, synthetic data only, no production network path or shared credentials. |\n| E11 | Personal and non-administrative devices | Devices that cannot reach production or customer data | None by policy | A device that could reach production would become a path to it | **Out, conditional** | Only company-managed devices passing posture checks can use the production access gateway. |\n\n### 4.3 Support and corporate IT\n\n| ID | Platform | Purpose | Federal data (D#) | Impact on CIA of federal data | Decision | Rationale |\n|---|---|---|---|---|---|---|\n| S1 | Customer support ticketing | Customer issues and communication | D8 (D1 to D4 if pasted) | Becomes a shadow store of federal data | **Out, conditional** | Out only if policy and tooling prevent customer data being attached or pasted (redaction, structured intake, staff training). Otherwise **In**. |\n| S2 | Corporate email | Company mail | D8 if forwarded | Same shadow-store risk | **Out, conditional** | Same condition as S1: data loss prevention blocks customer content, support uses S1 only. |\n| S3 | Corporate chat | Internal messaging | D8 if shared | Same | **Out, conditional** | Same condition; no customer content permitted in chat. |\n| S4 | Support impersonation / \"view as customer\" tooling | Lets support see a tenant's console | D1 to D6 | Direct access to federal data | **In** | Handles federal data by design. If the feature is not built, this row disappears. |\n| C1 | Marketing website and analytics | Public site | None | No path to production or data | **Out** | Hosted separately, no shared accounts, no customer data, no routes into production. |\n| C2 | Sales CRM | Prospects and contracts | None (business contacts only) | No path to production or data | **Out** | Holds prospect data, not customer service data. Prospect contacts are not federal customer data processed by the offering. |\n| C3 | HR and payroll | Employee records | None | Employee data only | **Out** | Not federal customer data and no effect on it. |\n| C4 | Finance and billing | Invoicing and usage-based billing | Per-tenant usage counts (metadata) | Counts are metadata about federal customer data, which `MAS-CSO-MDI` pulls into scope | **Out, conditional** | Out only while the export is aggregate monthly counts per tenant with no alert, user or content detail. |\n| C5 | Internal wiki and documentation | Runbooks, design docs | None, but runbooks may contain sensitive detail | Could expose how to attack the service | **Out, conditional** | No secrets or customer data in the wiki; access limited to staff. Reviewed as part of documentation controls. |\n| C6 | Corporate network and office IT | Office connectivity | None | No production path (access is via E6 only) | **Out** | Staff reach production only through the access gateway; the office network is untrusted by design. |\n\n### 4.4 Third parties in the data path\n\n| ID | Platform | Purpose | Federal data (D#) | Impact on CIA of federal data | Decision | Rationale |\n|---|---|---|---|---|---|---|\n| T1 | Mobile push notification service | Delivers push messages to responder phones | D3 (reference only by policy) | Provider sees device tokens and message metadata; outage delays push | **In (3P)** | In the delivery path. Payload policy means no D4 content is sent. |\n| T2 | Transactional email delivery service | Sends email notifications | D1 (address), D3 | Provider sees recipients and metadata | **In (3P)** | In the delivery path. Reference-only content. |\n| T3 | Telephony provider for SMS and voice | Content-free nudges and voice calls | D1 (phone numbers), D3 timing | Provider sees phone numbers and that a page occurred | **In (3P)** | Handles personal numbers. Open decision: whether a provider with FedRAMP authorization is available, or the data path is limited to the minimum (see section 6). |\n| T4 | Application performance and error tracking service | Captures errors and traces | D9, potentially D3 and D4 | Error reports can leak alert content or contact data | **Out, conditional** | Out only if scrubbing prevents any D1 to D4 from leaving the platform; verified by test. Otherwise **In (3P)**. |\n| T5 | Cloud infrastructure provider | Underlies P1 to P13 | All | Provider failure or compromise affects everything | **In (3P)** | Documented as the underlying provider; inherited controls recorded separately. |\n\n### 4.5 People and process resources\n\nInformation resources include non-machine-based resources such as staff, policies and procedures. These are in scope because they determine how the technology is operated and who can reach federal customer data.\n\n| ID | Resource | Why it is in scope | Linked platforms |\n|---|---|---|---|\n| N1 | Engineering staff with production access | Their actions and access can change or expose federal data | E6, E7, E8 |\n| N2 | Customer support staff with tenant access | Can view tenant data through support tooling | S4, E7, E8 |\n| N3 | Security and compliance team | Their processes detect and respond to threats against federal data | E4, E5 |\n| N4 | Security policies and procedures | Managerial controls that govern how the offering protects federal data | all |\n| N5 | Personnel security process (screening, training, offboarding) | Determines who gets access and when it ends. The HR system itself (C3) stays out. | all |\n| N6 | Third-party risk management process | Governs T1 to T5 | T1 to T5 |\n| N7 | Incident and on-call operations for the offering | Determines how quickly incidents affecting federal data are handled | E4 |\n\n---\n\n## 5. Where each data category can live\n\nA **\u25cf** means the category is stored or processed there by design; **\u25cb** means it could be present by accident or misuse and must be controlled.\n\n| | P1 | P2 | P3 | P4 | P5 | P6 | P7 | P8 | P10 | E4 | E8 | S1\u2013S3 | S4 | T1 | T2 | T3 | T4 | P12 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| D1 Contact data | | \u25cf | \u25cf | \u25cf | | | \u25cb | | \u25cf | \u25cb | \u25cb | \u25cb | \u25cf | \u25cb | \u25cf | \u25cf | \u25cb | |\n| D2 Schedules, policy | | \u25cf | \u25cf | \u25cf | | | | | \u25cf | | | \u25cb | \u25cf | | | | | |\n| D3 Alert metadata | | \u25cf | \u25cf | \u25cf | | | \u25cf | \u25cf | \u25cf | \u25cf | \u25cb | \u25cb | \u25cf | \u25cf | \u25cf | \u25cf | \u25cb | |\n| D4 Alert summaries | | \u25cf | \u25cf | \u25cf | | | \u25cf | \u25cf | \u25cf | \u25cb | \u25cb | \u25cb | \u25cf | | | | \u25cb | |\n| D5 Audit trail | | \u25cf | \u25cf | \u25cf | | | | | | \u25cf | | | \u25cf | | | | | |\n| D6 Tenant / identity | \u25cf | \u25cf | \u25cf | \u25cf | | | | \u25cf | \u25cf | \u25cb | | | \u25cf | | | | | |\n| D7 Integration credentials | | \u25cf | \u25cf | | \u25cf | \u25cf | | \u25cf | | \u25cb | \u25cb | \u25cb | | | | | \u25cb | |\n| D8 Support-derived | | | | | | | | | | | \u25cf | \u25cf | \u25cf | | | | | |\n| D9 Telemetry | | \u25cf | | | | | | | | \u25cf | | | | | | | \u25cf | |\n| D10 Backups, exports | | | \u25cf | \u25cf | \u25cf | | | | | | | | | | | | | \u25cf |\n\n**Reading the table.** Every \u25cb in an Out, conditional platform (S1 to S3, T4, E8 personal devices) is a **condition that must be enforced and evidenced**, because those cells are where federal data can end up outside the boundary. They become candidates for validators in the later technical phase.\n\n---\n\n## 6. Judgment calls and open decisions\n\n> **Update 2026-11-19:** every leaning below was accepted. See SD-004 in `security-decision-record.md` and section 10 of `minimum-assessment-scope.md`.\n\n| # | Decision | Options | Leaning |\n|---|---|---|---|\n| 1 | Telephony (T3): in the offering as a 3P resource, or reduce the data path? | Use a provider with FedRAMP authorization; or send only a number plus a fixed \"open the app\" nudge and keep call or SMS content-free | Content-free design plus 3P documentation. Record as SD-002. |\n| 2 | Support tooling (S1 to S3): out with controls, or in? | Out if customer content is blocked by tooling; in if staff paste freely | Out, conditional, with structured intake and redaction. Cheaper to assess, but the conditions must be provable. |\n| 3 | Error tracking (T4): scrub or include? | Strict scrubbing verified by test, or bring it in as a third-party resource | Scrub. Add a validator that checks outbound error payloads. |\n| 4 | Staff devices (E8): all devices or administrative only? | Whole fleet in scope, or only devices that can reach production or customer data | Administrative only, enforced by access gateway device posture checks. |\n| 5 | Staging (E10): out or in? | Out if synthetic data only | Out, conditional; guardrails against copying production data. |\n| 6 | Support impersonation (S4): build it? | Skip the feature, or build with approval workflow and full audit | Build with approval and customer-visible audit, since customers will ask for it. |\n| 7 | Preliminary Moderate rating: confirm? | Moderate across C, I and A, or lean Integrity higher for control data | Confirm in the security categories step. |\n| 8 | Recovery model: warm standby, pilot light, backup and restore, or multi-AZ only? | See SD-003 | **Chosen: backup and restore** with cross-region encrypted backups. RTO 8h and RPO 4h are fictional objectives; FedRAMP leaves them to the provider (KSI-RPL-RRO). |\n\n---\n\n## 7. Resulting boundary\n\n- **Production service (P1 to P13):** in scope. The mobile app is outside scope (supplement SUP1).\n- **Engineering and operations:** E2 to E6 and E8 in scope. E1, E7 and E9 are hosted by other companies and documented as third-party resources. E10 and E11 out, with conditions.\n- **Support and corporate IT:** S4 in scope. S1 to S3, C4 and C5 out, with conditions. C1 to C3 and C6 out.\n- **People and processes:** N1 to N7 in scope.\n- **Third parties:** E1, E7, E9, T1, T2, T3 and T5 documented as third-party resources. T4 out, with a scrubbing condition.\n- **Totals:** 27 in scope (20 machine-based, 7 people and process), 7 third party, 8 conditional, 4 out, 1 supplement.\n\nThe boundary covers whatever can hold alert, contact or credential data, and whatever can change routing, identity or deployed code. Every conditional exclusion names the control that keeps it out.\n\n## 8. Next document\n\n**Completed:** information flows and security categories (`MAS-CSO-FLO`) are in `mas/mas-record.json` and the generated `minimum-assessment-scope.md`, including the diagram, 42 flows plus prohibited flows, and the condition register for every conditional exclusion.\n"},{"id":"incident-response-plan","name":"Incident Response Plan","note":"Roles, PAIN ratings and reporting steps.","tier":"gated","md":"# Incident Response Plan\n\n> FICTIONAL DEMO DOCUMENT. Orrinwick Labs, Inc. is invented. Nothing here is a real security record or FedRAMP certification.\n\n| | |\n|---|---|\n| Owner | CISO (fictional) |\n| Version | 1.0, approved by the CISO on 2026-11-21 |\n| Last reviewed | 2026-11-21, by the CISO, when version 1.0 was approved (recorded in `environment/grc-records.json`) |\n| Rules | `IEC-CSO-*`, `VER-TFR-IRI`, `VER-TFR-NRI` in `rules-matrix.md` |\n| KSIs | KSI-INR-AAR, KSI-INR-RIR, KSI-INR-RPI |\n| Policy | `POL-INR` |\n\n## Scope\n\nThis plan applies to every incident that affects, or could affect, an information resource marked in scope in `mas/mas-record.json`, including incidents at the third parties listed there. An incident has the meaning given in 44 USC 3552(b)(2): an occurrence that actually or imminently jeopardizes the integrity, confidentiality or availability of information or an information system without lawful authority, or that violates or threatens to violate law, security policy or acceptable use policy.\n\nThe IEC rules require prompt and responsible evaluation and notification, and they do not set fixed hours. The times in this plan are Orrinwick's own targets. Missing a target is recorded in the incident record and reviewed in the after action report.\n\n## 1. Roles and contacts\n\n| Role | Held by | Responsibilities |\n|---|---|---|\n| On-call responder | Security Operations rota | Acknowledges an alert within 15 minutes, opens the incident record and starts the evaluation |\n| Incident lead | Security Operations Lead, or the on-call responder until the lead joins | Runs the response, records the timeline, decides containment steps with the Platform Lead |\n| Federal incident response coordinator | CISO | Decides FedRAMP reportability, approves the Potential Agency Impact N-rating, approves every report sent to agencies and FedRAMP, and is the named contact in each report |\n| FedRAMP and agency communications | GRC Lead | Prepares the initial, ongoing and final incident reports, keeps the list of affected agencies, files the reports in the incident record |\n| Technical recovery | Platform Lead | Containment, eradication and recovery of affected resources, including a restore under the recovery plan (POL-RPL, SD-003) |\n| Executive sponsor | Executive team | Receives a briefing on every reportable incident and every incident rated N3 or above |\n\nA person may hold more than one role during an incident. The CISO names a deputy for the coordinator role when absent. The GRC Lead keeps the contact list for every agency tenant and for FedRAMP.\n\n## 2. Incident rating\n\nEach incident receives two ratings. They answer different questions and both are recorded in the incident record.\n\n**Reportability (IEC-CSO-EFR).** An incident is a FedRAMP Reportable Incident when it affects, or is likely to affect, the confidentiality or integrity of federal customer data. Federal customer data is defined by data class in the scope record. For Orrinwick Beacon it includes responder contact details and alert content. An incident that affects only availability is not reportable under this test, but it is still rated below.\n\n**Potential Agency Impact N-rating (IEC-CSO-EFI).** The PAIN rating estimates the likely effect of the incident on the agencies that use Orrinwick Beacon.\n\n| Rating | Likely effect on agencies | Example for Orrinwick Beacon |\n|---|---|---|\n| N0 | No adverse effect is likely | A blocked phishing email sent to one staff member |\n| N1 | Minimal effect on one or more agencies | A short delay in a non-urgent notification channel for one tenant |\n| N2 | Narrow effect on one or more agencies | One agency's escalation rule was changed without approval and was corrected before it affected an alert |\n| N3 | Disruptive effect on one agency | Alerts for one agency were not delivered for two hours |\n| N4 | Debilitating effect on one agency, or disruptive effect on more than one | Responder contact details for one agency were exposed, or alert delivery failed for several agencies |\n| N5 | Debilitating effect on more than one agency | Contact data or alert content for several agencies was altered or exposed |\n\n**Default rating (IEC-CSO-DPR).** A reportable incident is treated as N5 until the CISO approves an estimate. An unrated reportable incident is never treated as a lower rating.\n\n**After action reports.** Every FedRAMP Reportable Incident, and every incident rated N2 or above, ends with an after action report (section 7, POL-INR INR-2).\n\n## 3. Detection and declaration\n\n1. Alerts reach the on-call responder from the monitoring and logging service, the identity provider, the vulnerability disclosure inbox, third-party notices and staff reports.\n2. The responder acknowledges the alert within 15 minutes. This is the same response time that applies to suspicious account activity (POL-IAM IAM-6).\n3. If the event meets the definition in the Scope section, the responder declares an incident within 30 minutes of acknowledgement and opens an incident record with a tracking identifier in the form `INC-YYYY-NNN`.\n4. The incident record holds the timeline, the ratings and the reasons for them, the reports sent, and links to tickets and evidence. It is the single source for every report in section 5.\n\n## 4. Evaluation\n\n| Step | Rule | Target | Recorded as |\n|---|---|---|---|\n| Decide whether the incident is a FedRAMP Reportable Incident | IEC-CSO-EFR | Within 1 hour of declaration | `reportable`, with the time and the reason |\n| Estimate the PAIN rating | IEC-CSO-EFI | Within 4 hours of the reportability decision | `pain_rating`, with the explanation |\n| Until the estimate is approved, treat a reportable incident as N5 | IEC-CSO-DPR | Immediately | Rating history in the incident record |\n| Revise both ratings when new facts change them | IEC-CSO-EFI | As facts change | Rating history in the incident record |\n\nThe incident lead proposes both ratings. The CISO approves them. When the evidence is not clear, the higher rating applies until the facts are known.\n\n**Vulnerabilities treated as incidents (VER-TFR-IRI, VER-TFR-NRI).** A likely exploitable vulnerability that is reachable from the internet and has a PAIN rating above N3 is handled as a FedRAMP Reportable Incident until it is partially mitigated to N3 or below. Orrinwick also applies this to a likely exploitable vulnerability that is not internet-reachable and is rated N5, until it is partially mitigated to N4 or below. The vulnerability report (`docs/vdr-report.md`) records each such case with its incident identifier.\n\n## 5. Reporting to agencies and FedRAMP\n\n**When the reporting clock starts.** The reporting targets in this section start once Orrinwick has evaluated the event, determined that it is a FedRAMP Reportable Incident (IEC-CSO-EFR), and assigned its PAIN rating or applied the default of N5 (IEC-CSO-EFI, IEC-CSO-DPR). They do not start at initial detection. A later estimate that changes the rating does not restart the clock. The evaluation targets in section 4 start at declaration.\n\nReports go to FedRAMP and to every affected agency, using the contacts the GRC Lead keeps. Each report is approved by the CISO and is written so that it does not expose sensitive details that would harm the service or other customers.\n\n**Initial Incident Report (IEC-CSO-IIR).** Sent within 1 hour after the reporting clock starts. It contains as much of the following as is known at that time, and states which items are not yet known:\n\n- contact information for the federal incident response coordinator\n- the Orrinwick tracking identifier\n- a description of the incident\n- the timeline: start time, time and source of detection, time the reportability evaluation was completed, and other major milestones\n- the current and earlier PAIN ratings, with the explanation\n- the functional impact on agencies, including the effect on confidentiality or integrity and the federal customer data types affected\n- the estimated recovery plan, milestones and timelines\n- the list of agencies likely to be affected\n\n**Ongoing Incident Reports (IEC-CSO-OIR).** Sent at least every 24 hours while the incident is open, and sooner when significant new information is known. When nothing has changed, the report says so. Each report updates every item in the initial report and adds, as known: observed incident activity, indicators of compromise, related CVE identifiers, the root cause, and response and recovery activities.\n\n**Final Incident Report (IEC-CSO-FIR).** Sent within 5 business days after the incident is resolved and recovery is complete. It gives the final status of every item in the earlier reports.\n\n## 6. Automation (IEC-CSO-AIR)\n\n| Part of the process | Automated | Manual |\n|---|---|---|\n| Alert routing to the on-call responder | Yes | |\n| Incident record and tracking identifier | Created from the alert | Declaration by the responder |\n| Timeline | Detection and acknowledgement times captured from the alerting system | Other milestones entered by the incident lead |\n| List of affected agencies | Built from the tenants of the affected resources | Checked by the GRC Lead |\n| Report drafts | Initial and ongoing report drafts generated from the incident record fields | Text reviewed by the GRC Lead |\n| Sending reports | Sent from the incident record to the stored contacts | Approval by the CISO before each send |\n| 24-hour ongoing report reminder | Yes | |\n\nThe CISO's approval stays manual because each report states ratings and impact that need human judgement.\n\n## 7. Containment, eradication and recovery\n\nThe incident lead and the Platform Lead decide containment steps. Changes made during an incident follow the emergency change path in POL-CMT and are reviewed after the incident (KSI-CMT-RVP). When data or a service must be restored, recovery follows the backup and restore strategy in SD-003 and the recovery objectives in `environment/recovery-objectives.json`. Using the recovery environment is logged as a significant change event (SD-004, OQ9).\n\n## 8. After action reports (KSI-INR-AAR)\n\nAn after action report is completed within 10 business days after the incident is closed, for every reportable incident and every incident rated N2 or above. The incident lead writes it and the CISO approves it. It contains:\n\n1. a summary, the final ratings and the reasons for any change in rating\n2. the timeline, with each target in this plan and whether it was met\n3. the root cause and the factors that contributed to it\n4. what worked and what did not\n5. each lesson, with the ticket or change reference that carries it into the backlog\n6. whether this plan needs to change (`plan_change_required`)\n\nA lesson without a ticket or change reference is not complete. When the report finds that this plan needs to change, the CISO reviews the plan (section 9).\n\n## 9. Reviews (KSI-INR-RIR, KSI-INR-RPI)\n\n| Review | Owner | When | Recorded in |\n|---|---|---|---|\n| Plan review | CISO | Each year, and when an after action report or a quarterly incident review finds that the plan needs to change | `ir_plan.reviews`, one new entry for each review with its date and reviewer | |\n| Past incident review | Security team, led by the Security Operations Lead | At least every 90 days. Covers all incidents and near misses of any rating since the previous review, and lists each incident covered | `incident_pattern_reviews` |\n| Tabletop exercise | Security Operations Lead | At least once a year, with the incident and recovery roster (POL-CED CED-4) | Training records |\n\nThe past incident review looks for repeated causes and weaknesses that single incidents do not show. When it finds that this plan needs to change, it sets `plan_change_required` and the CISO reviews the plan.\n\n## 10. Records\n\n| Record | Location |\n|---|---|\n| Incident record, timeline, ratings and reports | Incident tracker. Summary fields in `environment/grc-records.json` under `incidents` |\n| After action reports | Incident tracker, linked from the incident record |\n| Plan reviews | `environment/grc-records.json` under `ir_plan` |\n| Past incident reviews | `environment/grc-records.json` under `incident_pattern_reviews` |\n| Vulnerabilities treated as incidents | `docs/vdr-report.md` |\n\nRecords are kept for at least three years.\n"},{"id":"minimum-assessment-scope","name":"Minimum Assessment Scope","note":"The assessed boundary, data flows, security categories and conditional exclusions.","tier":"gated","md":"# Minimum Assessment Scope: Orrinwick Beacon\n\n> **FICTIONAL DEMO DOCUMENT.** Orrinwick Labs, Inc. is invented. **Generated** from `mas/mas-record.json` by `tools/build_mas.py`. Edit the JSON, not this file.\n\n| | |\n|---|---|\n| Offering | Orrinwick Beacon (Orrinwick Labs, Inc.) |\n| Target | FedRAMP 20x Class C |\n| Record version / status | 0.1.0 / draft |\n| FRMR dataset | 2026.11.02.01 |\n| Overview | `docs/company-and-offering.md` |\n\n## 1. Summary\n\nThe cloud service offering is the set of **27 in-scope information resources** (20 machine-based, 7 people and process). Beyond that: 7 third-party resources are documented, 8 are excluded only on stated conditions, 4 are excluded outright and 1 is a supplement item.\n\n**Highest security category across in-scope resources (confidentiality / integrity / availability): Moderate / Moderate / Moderate.** Levels are preliminary working labels (see open question OQ6).\n\n| Rule | Requirement in short | Where addressed |\n|---|---|---|\n| `MAS-CSO-IIR` | List the information resources that may touch federal customer data | Sections 2 and 3 |\n| `MAS-CSO-FLO` | Document and explain information flows and security categories for all resources | Sections 4 and 5 |\n| `MAS-CSO-MDI` | Include metadata, including metadata about federal customer data | Section 6 |\n| `MAS-CSO-TPR` | Document third-party resources: usage, justification, mitigations, compensating controls | Section 7 |\n| `MAS-CSO-SUP` | Optionally supplement; clearly separated and not certified | Section 8 |\n\n### How decisions are made\n\nA resource is **in scope** if it may handle federal customer data **or** may affect its confidentiality, integrity or availability. Information resources include people, policies and procedures as well as technology. A resource is excluded only with a stated reason; where it could plausibly end up holding data, it is excluded **only on named conditions** that must be evidenced (section 9).\n\n## 2. Information resources (MAS-CSO-IIR)\n\nSecurity category shown as confidentiality/integrity/availability (L, M, H). *Derived* means the maximum of the data classes the resource handles; *declared* is set where the resource holds no data but affects it.\n\n### 2.1 In scope: Production service\n\n| ID | Resource | Type | Handles | Category | Why it is in scope |\n|---|---|---|---|---|---|\n| P1 | Production cloud accounts and network | machine | none | M/M/M (declared) | Controls network isolation and administrative access to every store of federal customer data. |\n| P2 | Application compute (API, routing engine, notification workers, web console) | machine | D1, D2, D3, D4, D5, D6, D7, D9 | M/M/M (derived) | Directly handles federal customer data in memory and in transit. |\n| P3 | Managed relational database | machine | D1, D2, D3, D4, D5, D6, D7, D10 | M/M/M (derived) | Stores federal customer data at rest, including snapshots managed by the database service. |\n| P4 | Object storage | machine | D5, D10 | M/M/M (derived) | Holds federal customer data at rest; misconfiguration exposes exports and backups. |\n| P5 | Key management service | machine | none | M/M/M (declared) | Compromise or loss exposes or destroys access to every encrypted store. |\n| P6 | Secrets management service | machine | D7 | M/M/M (derived) | Holds integration credentials directly. |\n| P7 | Message queue and job scheduler | machine | D3, D4 | M/M/M (derived) | Handles alert content in transit and drives alert delivery availability. |\n| P8 | Load balancer, API gateway and web application firewall | machine | D1, D3, D4, D6, D7 | M/M/M (derived) | Terminates all customer traffic and sees data in transit. |\n| P9 | DNS and certificate management | machine | none | M/M/M (declared) | Can undermine integrity and confidentiality of all traffic and availability of the service. |\n| P10 | Push registration and device token service | machine | D1, D3 | M/M/M (derived) | Handles device tokens and references to alerts. The mobile app itself is outside scope (SUP1); this backend is in. |\n| P11 | Container registry and artifact store | machine | none | L/M/M (declared) | Tampered images give an attacker code execution where federal data is processed. |\n| P12 | Cross-region backup replica storage (us-west-2) | machine | D10 | M/M/M (derived) | Holds a full copy of federal customer data at rest (backups). It is the only standing resource in the recovery region; a recovery environment is built on demand from infrastructure code (OQ9). |\n| P13 | Recovery environment (built on demand in us-west-2) | machine | D1, D2, D3, D4, D5, D6, D7, D10 | M/M/M (derived) | Once running it is the production service and holds production data. It uses the same modules and controls as production (OQ9), so it stays in the boundary even while it is not deployed. |\n\n### 2.2 In scope: Engineering and operations\n\n| ID | Resource | Type | Handles | Category | Why it is in scope |\n|---|---|---|---|---|---|\n| E2 | CI/CD pipeline | machine | none | M/M/L (declared) | Can push arbitrary code to the systems that process federal data. |\n| E3 | Infrastructure as code state and runners | machine | none | M/M/L (declared) | Can open network paths or disable encryption. |\n| E4 | Production logging, monitoring and alerting stack | machine | D9 | M/M/L (derived) | Handles operational telemetry that references tenants, supports detection of attacks, and could receive leaked D1 to D4 if scrubbing fails. |\n| E5 | Vulnerability scanning and dependency analysis | machine | none | L/M/L (declared) | Hidden vulnerabilities remain exploitable in production. |\n| E6 | Privileged access management and production access gateway | machine | none | M/M/M (declared) | Compromise grants administrative access to production. |\n| E8 | Managed administrative endpoints | machine | D8 | M/M/L (declared+derived) | Compromise hands an attacker an operator's access. |\n\n### 2.3 In scope: People and processes\n\n| ID | Resource | Type | Handles | Category | Why it is in scope |\n|---|---|---|---|---|---|\n| N1 | Engineering staff with production access | people / process | none | M/M/M (declared) | Insider or compromised engineer can read, alter or destroy federal customer data. |\n| N2 | Customer support staff with tenant access | people / process
