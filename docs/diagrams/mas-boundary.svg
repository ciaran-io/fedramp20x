<rect width="1960" height="1130" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Orrinwick Beacon: Conditional and prohibited flows</text>
<text x="24" y="56" font-size="12.5" fill="#555555">What may cross the scope boundary only under a named condition (orange), and what must never cross it (red). Each prohibited flow is a candidate automated check.</text>
