<text x="634.0" y="641.0" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="600">✕ PF2 D1-D7,D10</text>
<rect x="509.8" y="919.2" width="80.4" height="17" rx="3" fill="#ffffff" fill-opacity="0.92" stroke="#c0392b" stroke-width="0.6"/>
<text x="550.0" y="932.2" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="600">✕ PF5 D1-D7</text>
<rect x="552.2" y="660.5" width="195.6" height="17" rx="3" fill="#ffffff" fill-opacity="0.92" stroke="#d79b00" stroke-width="0.6"/>
<text x="650.0" y="673.5" font-size="11" text-anchor="middle" fill="#d79b00" font-weight="600">F45 D8 · only while COND-S1-1</text>
<text x="1340" y="134" font-size="12" font-weight="700" fill="#c0392b">PF1  Customer content into support and corporate tools</text>
<text x="1340" y="150" font-size="11" font-weight="400" fill="#333333">From P2, P3, E4, S4  to  S1, S2, S3</text>
<text x="1340" y="166" font-size="11" font-weight="400" fill="#333333">Data: D1-D4,D7</text>
<text x="1340" y="182" font-size="11" font-weight="400" fill="#333333">Control: Structured intake, redaction and data loss prevention</text>
<text x="1340" y="198" font-size="11" font-weight="400" fill="#333333">keep customer content out; staff attest to policy.</text>
<text x="1340" y="214" font-size="11" font-weight="400" fill="#333333">Evidence: DLP and intake tests with seeded sample content;</text>
<text x="1340" y="230" font-size="11" font-weight="400" fill="#333333">quarterly sampling.</text>
<text x="1340" y="254" font-size="12" font-weight="700" fill="#c0392b">PF2  Production data into staging</text>
<text x="1340" y="270" font-size="11" font-weight="400" fill="#333333">From P3, P4  to  E10</text>
<text x="1340" y="286" font-size="11" font-weight="400" fill="#333333">Data: D1-D7,D10</text>
<text x="1340" y="302" font-size="11" font-weight="400" fill="#333333">Control: Separate accounts, deny policies on snapshot sharing</text>
<text x="1340" y="318" font-size="11" font-weight="400" fill="#333333">and no restore paths from production.</text>
<text x="1340" y="334" font-size="11" font-weight="400" fill="#333333">Evidence: Policy configuration check and restore-event audit.</text>
<text x="1340" y="358" font-size="12" font-weight="700" fill="#c0392b">PF3  Alert content into notification channels</text>
<text x="1340" y="374" font-size="11" font-weight="400" fill="#333333">From P2, P10  to  T1, T2, T3</text>
<text x="1340" y="390" font-size="11" font-weight="400" fill="#333333">Data: D4</text>
<text x="1340" y="406" font-size="11" font-weight="400" fill="#333333">Control: Payload policy: push, email, SMS and voice use</text>
<text x="1340" y="422" font-size="11" font-weight="400" fill="#333333">reference IDs and fixed text only. A payload linter blocks</text>
<text x="1340" y="438" font-size="11" font-weight="400" fill="#333333">sends that contain summary text.</text>
<text x="1340" y="454" font-size="11" font-weight="400" fill="#333333">Evidence: Linter unit tests and sampled outbound payload</text>
<text x="1340" y="470" font-size="11" font-weight="400" fill="#333333">review.</text>
<text x="1340" y="494" font-size="12" font-weight="700" fill="#c0392b">PF4  Identifiers and content to error tracking</text>
<text x="1340" y="510" font-size="11" font-weight="400" fill="#333333">From P2  to  T4</text>
<text x="1340" y="526" font-size="11" font-weight="400" fill="#333333">Data: D1-D4</text>
<text x="1340" y="542" font-size="11" font-weight="400" fill="#333333">Control: Scrubbing removes tenant, user and alert identifiers</text>
<text x="1340" y="558" font-size="11" font-weight="400" fill="#333333">and all content before telemetry leaves the platform.</text>
<text x="1340" y="574" font-size="11" font-weight="400" fill="#333333">Evidence: Pipeline test that injects canary values and asserts</text>
<text x="1340" y="590" font-size="11" font-weight="400" fill="#333333">they never appear outbound.</text>
<text x="1340" y="614" font-size="12" font-weight="700" fill="#c0392b">PF5  Unmanaged devices to production</text>
<text x="1340" y="630" font-size="11" font-weight="400" fill="#333333">From E11  to  E6, P1, P2, P3</text>
<text x="1340" y="646" font-size="11" font-weight="400" fill="#333333">Data: D1-D7</text>
<text x="1340" y="662" font-size="11" font-weight="400" fill="#333333">Control: Gateway device posture checks deny any device not</text>
<text x="1340" y="678" font-size="11" font-weight="400" fill="#333333">enrolled in management and EDR.</text>
<text x="1340" y="694" font-size="11" font-weight="400" fill="#333333">Evidence: Gateway policy export and denied-access log sample.</text>
<text x="1340" y="718" font-size="12" font-weight="700" fill="#c0392b">PF6  Detailed usage data to billing</text>
<text x="1340" y="734" font-size="11" font-weight="400" fill="#333333">From P3  to  C4</text>
<text x="1340" y="750" font-size="11" font-weight="400" fill="#333333">Data: D3,D5</text>
<text x="1340" y="766" font-size="11" font-weight="400" fill="#333333">Control: Export schema allows only per-tenant aggregate</text>
<text x="1340" y="782" font-size="11" font-weight="400" fill="#333333">counts.</text>
<text x="1340" y="798" font-size="11" font-weight="400" fill="#333333">Evidence: Schema validation test on the export job.</text>
<text x="1340" y="822" font-size="12" font-weight="700" fill="#c0392b">PF7  Credentials and customer content into the wiki</text>
<text x="1340" y="838" font-size="11" font-weight="400" fill="#333333">From P2, P3, P6, E4, S4  to  C5</text>
<text x="1340" y="854" font-size="11" font-weight="400" fill="#333333">Data: D7,D8</text>
<text x="1340" y="870" font-size="11" font-weight="400" fill="#333333">Control: Secret scanning blocks credentials; policy and review</text>
<text x="1340" y="886" font-size="11" font-weight="400" fill="#333333">keep customer content out of runbooks and design documents.</text>
<text x="1340" y="902" font-size="11" font-weight="400" fill="#333333">Evidence: Secret scan results on the wiki and a quarterly</text>
<text x="1340" y="918" font-size="11" font-weight="400" fill="#333333">content sample.</text>
