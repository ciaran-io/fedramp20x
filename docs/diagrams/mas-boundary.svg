<text x="631.1" y="335.0" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="600">✕ PF1 D1-D4,D7</text>
<rect x="593.8" y="388.0" width="80.4" height="17" rx="3" fill="#ffffff" fill-opacity="0.92" stroke="#c0392b" stroke-width="0.6"/>
<text x="634.0" y="401.0" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="600">✕ PF7 D7,D8</text>
<rect x="517.1" y="582.4" width="259.6" height="17" rx="3" fill="#ffffff" fill-opacity="0.92" stroke="#d79b00" stroke-width="0.6"/>
<text x="646.9" y="595.4" font-size="11" text-anchor="middle" fill="#d79b00" font-weight="600">F41 usage counts · only while COND-C4-1</text>
<rect x="537.7" y="527.3" width="80.4" height="17" rx="3" fill="#ffffff" fill-opacity="0.92" stroke="#c0392b" stroke-width="0.6"/>
<text x="577.9" y="540.3" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="600">✕ PF6 D3,D5</text>
